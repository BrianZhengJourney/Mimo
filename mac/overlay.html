/* Pet click → complete journal on today's view. */
function famToggleContext(){famShowJournal();}

let suppressFamiliarOpenOnce=false;

/* Close immediately when a click lands in the transparent WebView outside
   the journal. Native also monitors clicks beyond this panel. */
document.addEventListener('pointerdown',event=>{
  const journal=document.getElementById('journal');
  if(!journal.classList.contains('on')||event.target.closest('#journal'))return;
  suppressFamiliarOpenOnce=!!event.target.closest('#familiar');
  famCloseJournal();
},true);

document.addEventListener('keydown',event=>{
  if(!document.getElementById('journal').classList.contains('on'))return;
  if(event.key==='Escape'){ event.preventDefault();famCloseJournal();return; }
  if(event.key==='ArrowLeft'){ event.preventDefault();jSetView('today'); }
  if(event.key==='ArrowRight'){ event.preventDefault();jSetView('week'); }
});

document.addEventListener('DOMContentLoaded', () => {
  Fam.setCharacter(localStorage.getItem('ff-char') || 'lulu');
  famShowStatusBadge();

  // click = complete journal; press-and-move = drag (window moved by Swift).
  const fam = document.getElementById('familiar');
  const hasBridge = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge);
  let pd = null, dragging = false;
  fam.addEventListener('pointerdown', e => {
    pd = { x: e.clientX, y: e.clientY }; dragging = false;
    fam.setPointerCapture(e.pointerId);
  });
  fam.addEventListener('pointermove', e => {
    if (!pd || dragging) return;
    if (Math.hypot(e.clientX - pd.x, e.clientY - pd.y) > 8) {
      dragging = true; bridge({ type: 'dragStart' });
    }
  });
  fam.addEventListener('pointerup', () => {
    const suppressOpen=suppressFamiliarOpenOnce;
    suppressFamiliarOpenOnce=false;
    if (dragging) bridge({ type: 'dragEnd' });
    else if (suppressOpen) { /* this gesture only dismissed the journal */ }
    else if (hasBridge) bridge({ type: 'famClick' });
    else famShowJournal();
    pd = null; dragging = false;
  });
  // if the pointer is lost mid-drag, end the drag - otherwise the window
  // follows the mouse forever (the 'pet chases my cursor' bug)
  for (const ev of ['pointercancel', 'lostpointercapture']) {
    fam.addEventListener(ev, () => {
      if (dragging) bridge({ type: 'dragEnd' });
      suppressFamiliarOpenOnce=false;
      pd = null; dragging = false;
    });
  }
  // right-click on the pet -> native context menu (hide, settings, quit)
  fam.addEventListener('contextmenu', e => {
    e.preventDefault();
    bridge({ type: 'ctxMenu' });
  });
  // Preview mode in a normal browser. `journal-dense` is the regression
  // fixture for a 21-item half hour and the expandable bulletin.
  const q = new URLSearchParams(location.search);
  famSetLanguage(q.get('lang') || LANG);
  if (q.has('preview')) {
    document.body.style.background = '#1a1534';
    if (q.get('scale')) famSetDisplayScale(q.get('scale'));
    if (q.get('char')) Fam.setCharacter(q.get('char'));
    if (q.get('state')) Fam.setState(q.get('state'));
    if (q.get('mstate')) Mascot.setState(q.get('mstate'));
    const journalPreview = q.get('preview');
    if (journalPreview === 'pet-prototype') {
      famSetPrototypePet({
        name:'Pocket Moss', variant:'cozy',
        PAL:{P:'#b98768',L:'#f0cdb2',A:'#74c8ad',D:'#493833',K:'#241a20',W:'#ffffff',M:'#382421'},
        BASE:['..P..........P..','.LPP........PPL.','.PPPP......PPPP.','PPPPPPPPPPPPPPPP',
          'PPLLLLLLLLLLLLPP','PPLLLLLLLLLLLLPP','PPLLLLLLLLLLLLPP','PPLLLLLLLLLLLLPP',
          'PPPLLLLLLLLLLPPP','PPPAAAAAAAAAAPPP','...PPPPPPPPPP...','....PPPPPPPP....',
          '....PP....PP....','...PPP....PPP...','...PP......PP...'],
        face:{lx:4,rx:10,y:5,mx:7,my:8}
      });
      Fam.setState('focused');
    }
    if (journalPreview === 'journal' || journalPreview === 'journal-dense') {
      const now = Date.now(), m = 60000;
      if (journalPreview === 'journal-dense') {
        const dense = [
          ['WeChat','neutral',5], ['Mail','neutral',2], ['Finder','neutral',1],
          ['Slack','neutral',1], ['Calendar','neutral',1], ['Notes','neutral',1],
          ['Spotify','neutral',1], ['Messages','neutral',1], ['Preview','neutral',1],
          ['Figma','cad',2], ['Terminal','term',1], ['X','distraction',1],
          ['YouTube','distraction',1], ['VS Code','code',2], ['Notion','neutral',1],
          ['Linear','neutral',1], ['GitHub','code',1], ['Safari','neutral',1],
          ['System Settings','neutral',1], ['Raycast','neutral',1]
        ];
        let cursor = now - 29 * m;
        Fam.history = dense.map(([app, kind, minutes]) => {
          const entry = { app, kind, detail: `${app} activity`, canon: app,
            t0: cursor, t1: cursor + minutes * m };
          cursor = entry.t1;
          return entry;
        });
        Fam.cur = {app:'Arc',kind:'neutral',detail:'127.0.0.1',canon:'Arc localhost',t0:now-m};
      } else {
        const at = (hour, minute = 0) => {
          const d = new Date(now); d.setHours(hour, minute, 0, 0); return d.getTime();
        };
        Fam.history = [
          {app:'VS Code',kind:'code',detail:'Mimo — overlay.html',canon:'Mimo overlay',t0:at(8,10),t1:at(9,20)},
          {app:'Arc',kind:'neutral',detail:'morning tabs',canon:'Arc research',t0:at(9,30),t1:at(10,15)},
          {app:'Preview',kind:'paper',detail:'Designing Data-Intensive Applications',canon:'Designing Data-Intensive Applications',t0:at(10,20),t1:at(11,50)},
          {app:'Mail',kind:'neutral',detail:'inbox',canon:'Mail',t0:at(12,0),t1:at(12,40)},
          {app:'Figma',kind:'cad',detail:'Woven Day studies',canon:'Woven Day',t0:at(12,45),t1:at(14,30)},
          {app:'X',kind:'distraction',detail:'Home / X',canon:'X feed',t0:at(14,30),t1:at(15,10)},
          {app:'Notion',kind:'notes',detail:'Mimo — design notes',canon:'Mimo design notes',t0:at(15,20),t1:at(17,45)},
          {app:'Messages',kind:'neutral',detail:'catch up',canon:'Messages',t0:at(18,0),t1:at(18,50)},
          {app:'Terminal',kind:'term',detail:'mimo — zsh',canon:'Mimo build',t0:at(19,0),t1:at(20,10)},
          {app:'YouTube',kind:'distraction',detail:'Home',canon:'YouTube',t0:at(20,10),t1:at(20,35)}
        ].map(h => ({...h, t1:Math.min(h.t1, now)})).filter(h => h.t0 < now && h.t1 > h.t0);
        Fam.cur = {app:'VS Code',kind:'code',detail:'Cozy Parchment journal',canon:'Cozy Parchment journal',t0:now-32*m};
      }
      if (q.get('offline') === '1' && Fam.cur) {
        Fam.history.push({...Fam.cur, t1:now-5*m});
        Fam.cur = null;
      }
      Fam.focusStartedAt = Fam.cur ? Fam.cur.t0 : null;
      J.view = 'today'; J.openSess = null;
      document.getElementById('journal').classList.add('on');
      document.getElementById('stage').classList.add('journal-open');
      Mascot.setState(mascotStateFor(Fam.state));
      renderJournal();
    }
  }
});
