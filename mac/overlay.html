<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mimo 米墨</title>
<style>
/* ── transparent overlay: the creature lives bottom-right ── */
:root{
  --font-ui: -apple-system, 'Inter', sans-serif;
  --font-magic: 'Fraunces', Georgia, serif;
  --font-mono: 'SF Mono', Menlo, monospace;
  --ink:#e9e6f7; --ink-dim:#9d97b8;
  --fam-display-scale:1;
  --status-anchor-height:150px;
  --fam-glow: rgba(146,120,255,.45);
  /* wisp dynamic palette */
  --fam-hi:#cabcf5; --fam-lo:#7e68dc; --wisp:#b9a5ff;
  --eye-col:#2d2350; --mouth-col:#2d2350;
  --tint: transparent;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; background:transparent; overflow:hidden; }
body{ font-family:var(--font-ui); -webkit-user-select:none; }

.stage{ position:absolute; right:10px; bottom:6px; width:calc(150px * var(--fam-display-scale)); }
/* set by famSetNativeHosted() when companion_runtime.swift owns the familiar */
body.native-hosted .familiar,
body.native-hosted .shadow{ visibility:hidden; pointer-events:none; }

/* ── creature container ── */
.familiar{ position:relative; width:calc(150px * var(--fam-display-scale)); height:calc(150px * var(--fam-display-scale));
  animation:bob 3.6s ease-in-out infinite; transition:filter .6s, opacity .6s; }
@keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
.familiar svg{ width:100%; height:100%; overflow:visible; display:none; }
.familiar svg.cur{ display:block; }

.aura{ position:absolute; inset:-14px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, var(--fam-glow) 0%, transparent 66%);
  transition:opacity .8s, transform .8s; opacity:.75; }
.shadow{ position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
  width:70px; height:12px; border-radius:50%; background:#000; opacity:.28; filter:blur(4px); }

/* ── FamiliarMascot (design handoff, pixel-art): keyframes verbatim ── */
@keyframes ffp-bob {0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(1.04,.96)}}
@keyframes ffp-levitate {0%,100%{transform:translateY(-6px) scale(1,1)}50%{transform:translateY(-9px) scale(1.015,.985)}}
@keyframes ffp-dizzy {0%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(5px,-3px) rotate(9deg)}50%{transform:translate(0,-6px) rotate(0deg)}75%{transform:translate(-5px,-3px) rotate(-9deg)}100%{transform:translate(0,0) rotate(0deg)}}
@keyframes ffp-queasy {0%,100%{transform:rotate(-7deg) translateY(2px)}50%{transform:rotate(7deg) translateY(-2px)}}
@keyframes ffp-float {0%,100%{transform:translateY(-6px) translateX(0)}25%{transform:translateY(-16px) translateX(4px)}50%{transform:translateY(-26px) translateX(0)}75%{transform:translateY(-16px) translateX(-4px)}}
@keyframes ffp-pop {0%{transform:translateY(0) scale(1)}30%{transform:translateY(-24px) scale(1.12)}55%{transform:translateY(0) scale(1.1,.86)}75%{transform:translateY(-9px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
@keyframes ffp-sleepbob {0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(3px) scale(1.06,.93)}}
@keyframes ffp-proudhop {0%,100%{transform:translateY(0) rotate(0deg)}30%{transform:translateY(-13px) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}70%{transform:translateY(-11px) rotate(0deg)}}
@keyframes ffp-wobble {0%,100%{transform:translateY(0) rotate(-2deg)}35%{transform:translateY(-5px) rotate(3deg)}70%{transform:translateY(-2px) rotate(-4deg)}}
@keyframes ffp-blink {0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ffp-orb {0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ffp-zzz {0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(2.5px,-4.5px)}}
@keyframes ffp-ring {0%{opacity:.9;transform:scale(.35)}100%{opacity:0;transform:scale(1.35)}}
@keyframes ffp-twinkle {0%,100%{opacity:.15}50%{opacity:1}}
@keyframes ffp-bubbleUp {0%{opacity:0;transform:translateY(0)}30%{opacity:.9}100%{opacity:0;transform:translateY(-5px)}}
@keyframes ffp-mote {0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.9;transform:translateY(-1.6px)}}
@keyframes ffp-typeA {0%,100%{transform:translateY(0)}50%{transform:translateY(-1.3px)}}
@keyframes ffp-typeB {0%,100%{transform:translateY(-1.3px)}50%{transform:translateY(0)}}
@keyframes ffp-walk {0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}
@keyframes ffp-stepA {0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes ffp-stepB {0%,100%{transform:translateY(-1.5px)}50%{transform:translateY(0)}}
@keyframes ffp-eyeCycle {0%{opacity:1}33.34%{opacity:0}100%{opacity:0}}
/* Raster familiars are complete illustrations. Keep fallback motion subtle;
   large squash/rotation makes a full human silhouette feel rubbery. */
@keyframes ffp-raster-breathe {0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@keyframes ffp-raster-peek {0%,100%{transform:translate(0,0)}45%{transform:translate(1px,-.8px)}70%{transform:translate(0,-.4px)}}
@keyframes ffp-raster-bounce {0%,100%{transform:translateY(0)}45%{transform:translateY(-2.6px)}65%{transform:translateY(-.5px)}}
@keyframes ffp-raster-float {0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ffp-raster-wobble {0%,100%{transform:translateY(0) rotate(-.45deg)}50%{transform:translateY(-1px) rotate(.45deg)}}
@keyframes ffp-raster-dizzy {0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(1.1px) rotate(.45deg)}70%{transform:translateX(-1.1px) rotate(-.45deg)}}
@keyframes ffp-raster-celebrate {0%,100%{transform:translateY(0)}35%{transform:translateY(-4px)}62%{transform:translateY(-1px)}}
/* focus states breathe the aura around raster familiars (abstract-lane energy) */
@keyframes ffp-aura-pulse {0%,100%{opacity:var(--aura-base,.2)}50%{opacity:calc(var(--aura-base,.2)*2)}}
.ffp-wrap{ width:100%; height:100%; transform-origin:50% 100%; }
/* the mascot manages its own animation/filter/opacity/shadow — mute the
   generic state styling that would double-apply */
.familiar.char-pixel{ animation:none !important; opacity:1 !important; filter:none !important; }
body[data-char="pixel"] .shadow{ display:none; }

/* ── per-state glow color (used by bubble/journal shadows + sparkles) ── */
[data-state="idle"]{ --fam-glow:rgba(146,120,255,.42); }
[data-state="focused"]{ --fam-glow:rgba(64,224,178,.5); }
[data-state="scholar"]{ --fam-glow:rgba(110,140,255,.5); }
[data-state="dizzy"]{ --fam-glow:rgba(210,215,90,.4); }
[data-state="poisoned"]{ --fam-glow:rgba(130,200,60,.45); }
[data-state="ghost"]{ --fam-glow:rgba(160,170,210,.25); }

.spark{ position:absolute; width:7px; height:7px; pointer-events:none;
  background:radial-gradient(circle,#fff 0 30%, var(--fam-glow) 70%, transparent);
  border-radius:50%; animation:sparkUp 1.4s ease-out forwards; }
@keyframes sparkUp{ 0%{ transform:translateY(0) scale(.6); opacity:0;} 20%{ opacity:1;} 100%{ transform:translateY(-46px) scale(1.15); opacity:0;} }

/* ── transient focus status, docked to the familiar's head ── */
.status-badge{ position:absolute; right:50%; bottom:calc(var(--status-anchor-height) + 8px);
  display:flex; align-items:center; gap:2px; transform:translateX(50%);
  padding:4px 11px 4px 9px; border-radius:20px; background:rgba(20,16,40,.85); border:1px solid #ffffff1c;
  color:var(--ink); font-size:11.5px; font-weight:500; backdrop-filter:blur(8px); box-shadow:0 4px 14px #0006;
  white-space:nowrap; transition:border-color .4s; }
.status-badge-main,.status-badge-dismiss{ border:0; color:inherit; background:transparent; font:inherit; cursor:pointer; }
.status-badge-main{ display:flex; align-items:center; gap:8px; }
.status-badge-dismiss{ display:grid; place-items:center; }
.sb-dot{ width:7px; height:7px; border-radius:50%; background:#8890a8; box-shadow:0 0 6px #8890a8;
  transition:background .4s, box-shadow .4s; }
.status-badge.focus{ border-color:#3fe0b255; }
.status-badge.focus .sb-dot{ background:#3fe0b2; box-shadow:0 0 7px #3fe0b2cc; }
.status-badge.distract{ border-color:#e0574d55; }
.status-badge.distract .sb-dot{ background:#e0574d; box-shadow:0 0 7px #e0574dcc; }

/* ── Focus timer ── */
.chip{ display:flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px;
  background:rgba(20,16,40,.82); border:1px solid #ffffff1a; color:var(--ink);
  font-size:11px; backdrop-filter:blur(8px); box-shadow:0 4px 14px #0006; }
.chip b{ font-weight:600; font-variant-numeric:tabular-nums; }

/* ── journal: full openable history, bucketed by time ── */
.journal{ position:absolute; right:150px; bottom:10px; width:334px; max-height:300px;
  display:none; flex-direction:column; border-radius:15px; overflow:hidden;
  background:rgba(24,19,46,.95); backdrop-filter:blur(20px);
  border:1px solid rgba(185,165,255,.3);
  box-shadow:0 16px 44px rgba(0,0,0,.5), 0 0 26px var(--fam-glow);
  color:var(--ink); font-size:12px; }
.journal.on{ display:flex; }
.j-head{ display:flex; align-items:center; gap:8px;
  padding:10px 14px 8px; font-family:var(--font-magic); font-size:13.5px; color:#cabcf5;
  border-bottom:1px solid #ffffff12; flex:none; }
.j-close{ font-family:inherit; font-size:11px; color:var(--ink-dim); background:none;
  border:none; cursor:pointer; padding:2px 4px; }
.j-close:hover{ color:var(--ink); }
.j-now{ padding:9px 14px 0; flex:none; font-size:12.5px; color:var(--ink); }
.j-now b{ color:#fff; }
.j-now .jn-sub{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
.j-now .pct-good{ color:#7df0cf; font-weight:600; }
.j-now .pct-mid{ color:#ffd479; font-weight:600; }
.j-now .pct-bad{ color:#e88fae; font-weight:600; }
.j-tabs{ display:flex; gap:5px; padding:8px 14px 2px; flex:none; }
.j-tab{ font-family:inherit; font-size:10.5px; color:var(--ink-dim); background:#ffffff0a;
  border:1px solid #ffffff14; border-radius:14px; padding:3px 10px; cursor:pointer; }
.j-tab:hover{ color:var(--ink); }
.j-tab.cur{ color:#14102b; background:#cabcf5; border-color:#cabcf5; font-weight:600; }
.j-body{ overflow-y:auto; min-height:0; overscroll-behavior:contain; padding:8px 14px 12px; }
.j-bucket{ margin-bottom:10px; }
.j-bh{ font-size:10px; color:var(--ink-dim); letter-spacing:.06em; text-transform:uppercase;
  margin-bottom:4px; padding-bottom:2px; border-bottom:1px dashed #ffffff14; }
.j-sh{ cursor:pointer; user-select:none; }
.j-sh .arr{ display:inline-block; transition:transform .2s; font-size:9px; margin-right:2px; }
.j-sh.open .arr{ transform:rotate(90deg); }
.j-more{ font-size:10.5px; color:var(--ink-dim); cursor:pointer; padding:2px 0;
  text-decoration:underline; text-underline-offset:2px; }
.j-more:hover{ color:var(--ink); }
.j-total{ font-size:10.5px; color:var(--ink-dim); margin-left:6px; font-weight:400; }
.j-sec{ margin:4px 0 2px; }
.j-sh{ font-size:10.5px; color:#cabcf5; margin-bottom:2px; }
.j-sh.bad{ color:#e88fae; }
.j-item{ display:flex; gap:6px; align-items:baseline; padding:1.5px 0; }
.j-item .lbl{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.j-item .min{ color:var(--ink-dim); font-size:10.5px; flex:none; font-variant-numeric:tabular-nums; }
.j-empty{ color:var(--ink-dim); font-size:11.5px; padding:6px 0; }
.j-reflect{ display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-top:10px; padding-top:9px; border-top:1px solid #ffffff14; }
.j-reflect span{ color:var(--ink-dim); font-size:10px; }
.j-reflect button{ border:1px solid #ffffff20; border-radius:12px; padding:4px 9px;
  background:#ffffff0a; color:var(--ink); font:600 10.5px/1.2 inherit; cursor:pointer; }
.j-reflect button:hover{ background:#ffffff15; }
/* stacked focus bar + chronological strip */
.j-bar{ display:flex; height:8px; border-radius:4px; overflow:hidden; margin:6px 0 3px; background:#ffffff10; }
.j-bar i{ display:block; height:100%; }
.j-bar .deep{ background:linear-gradient(90deg,#2fae8f,#7df0cf); }
.j-bar .neut{ background:#5a5470; }
.j-bar .dist{ background:linear-gradient(90deg,#c14a6a,#e88fae); }
.j-legend{ display:flex; gap:10px; font-size:9.5px; color:var(--ink-dim); margin-bottom:4px; }
.j-legend b{ font-weight:600; }
.j-legend .ld{ color:#7df0cf; } .j-legend .ln{ color:#8f8aa8; } .j-legend .lx{ color:#e88fae; }
.j-note{ font-family:var(--font-magic); font-size:12px; color:#cabcf5; margin:2px 0 8px; }
.j-strip{ display:flex; height:16px; border-radius:4px; overflow:hidden; margin:2px 0 10px; background:#ffffff08; }
.j-strip i{ display:block; height:100%; min-width:1px; font-style:normal; overflow:hidden; }
.j-strip i span{ display:block; font-size:8.5px; line-height:16px; color:rgba(255,255,255,.95);
  padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.55); pointer-events:none; }
.j-strip .deep{ background:#2fae8f; } .j-strip .neut{ background:#3d3a52; } .j-strip .dist{ background:#c14a6a; }
.j-strip i:hover{ filter:brightness(1.25); }
.j-strip-cap{ display:flex; justify-content:space-between; font-size:9px; color:var(--ink-dim); margin:-7px 0 8px; }
/* fixed half-hour chapters: the cell is time; its three fills are meaning.
   App/site identity belongs in the bulletin below, never in this rail. */
.j-period-summary{ display:flex; align-items:center; gap:8px; margin:1px 0 5px; }
.j-period-title{ font-family:var(--font-magic); font-size:10.5px; color:var(--ink); white-space:nowrap; }
.j-period-title b{ font-size:12px; font-weight:600; }
.j-period-legend{ margin-left:auto; display:flex; align-items:center; gap:7px;
  color:var(--ink-dim); font-size:8.5px; white-space:nowrap; }
.j-period-legend span{ display:flex; align-items:center; gap:3px; }
.j-period-legend i{ width:6px; height:6px; border-radius:50%; display:inline-block; }
.j-period-legend .deep{ background:#2fae8f; }
.j-period-legend .neut{ background:#5a5470; }
.j-period-legend .dist{ background:#c14a6a; }
.j-period-rail{ --period-count:1; display:grid;
  grid-template-columns:repeat(var(--period-count),minmax(0,1fr)); gap:5px; }
.j-period{ position:relative; min-width:0; height:24px; overflow:hidden;
  border:1px solid #ffffff12; border-radius:8px; background:#ffffff09;
  box-shadow:inset 0 1px rgba(255,255,255,.04); transition:transform .12s,filter .12s; }
.j-period:hover{ transform:translateY(-1px); filter:brightness(1.08); }
.j-period.is-current{ border-color:#2fae8f88; box-shadow:0 0 0 1px #2fae8f1f,inset 0 1px rgba(255,255,255,.1); }
.j-period.future{ opacity:.28; border-style:dashed; }
.j-period-track{ position:absolute; inset:3px; display:flex; overflow:hidden;
  border-radius:5px; background:#ffffff05; }
.j-period-track i{ display:block; height:100%; flex:0 0 auto; min-width:0; }
.j-period-track .deep{ background:linear-gradient(90deg,#2fae8f,#58c9aa); }
.j-period-track .neut{ background:#5a5470; }
.j-period-track .dist{ background:linear-gradient(90deg,#c14a6a,#d96884); }
.j-period-rail.many{ gap:2px; }
.j-period-rail.many .j-period{ height:18px; border-radius:4px; }
.j-period-rail.many .j-period-track{ inset:1px; border-radius:2.5px; }
.j-period-rail.many .j-period:nth-child(2n + 1):not(:first-child){ margin-left:1.5px; }
.j-period-axis{ display:flex; justify-content:space-between; align-items:center;
  min-height:12px; margin:2px 0 7px; color:var(--ink-dim); font-size:8.5px;
  font-variant-numeric:tabular-nums; }
/* Woven Day v3: one soft gradient tile per half hour. Each tile borrows the
   colours of its neighbours, so the day morphs instead of breaking into
   category fragments. */
.j-day-summary{ display:flex; align-items:baseline; gap:5px; margin:2px 0 9px;
  color:var(--ink-dim); font-size:9px; white-space:nowrap; }
.j-day-summary .sigil{ color:#d6aa50; font-size:11px; }
.j-day-summary b{ color:var(--ink); font-family:var(--font-magic); font-size:12px; font-weight:600; }
.j-day-summary .sep{ opacity:.46; }
.j-weave-stack{ display:flex; flex-direction:column; gap:10px; margin:0 0 9px; }
.j-weave-row{ min-width:0; }
.j-weave-meta{ display:flex; align-items:baseline; gap:6px; min-height:13px; margin-bottom:1px; }
.j-weave-meta b{ font-family:var(--font-magic); font-size:9.5px; font-weight:600; letter-spacing:.01em; }
.j-weave-meta .range{ margin-left:auto; color:var(--ink-dim); font-family:var(--font-mono);
  font-size:8px; font-variant-numeric:tabular-nums; }
.j-weave-rail{ position:relative; height:20px; }
.j-weave-thread{ --period-count:12; position:relative; display:grid; grid-auto-flow:column;
  grid-auto-columns:18px; gap:3px; width:max-content; height:18px; min-width:0; }
.j-weave-row.morning .j-weave-thread{ margin-left:auto; }
.j-weave-row.daylight .j-weave-thread,.j-weave-row.afterglow .j-weave-thread{ margin-right:auto; }
.j-weave-cell{ position:relative; width:18px; height:18px; border-radius:5px;
  border:1px solid #ffffff18; box-shadow:inset 0 1px rgba(255,255,255,.24),0 1px 2px rgba(0,0,0,.12);
  cursor:default; opacity:0; transform:scale(.72); filter:blur(3px);
  animation:j-weave-morph .48s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay:calc(var(--i) * 24ms); transition:transform .15s,filter .15s,box-shadow .15s; }
.j-weave-cell:hover{ transform:translateY(-2px) scale(1.08); filter:saturate(1.15);
  box-shadow:inset 0 1px rgba(255,255,255,.34),0 4px 8px rgba(0,0,0,.18); }
.j-weave-cell.is-current{ border-color:#e0af48; box-shadow:0 0 0 1px #e0af4860,0 0 8px #e0af4850; }
.j-weave-cell.is-current::after{ content:""; position:absolute; width:4px; height:4px;
  top:2px; right:2px; border-radius:50%; background:#ffe08a; box-shadow:0 0 5px #e0af48; }
.j-weave-cell.is-future{ border-color:#ffffff0b; box-shadow:inset 0 1px rgba(255,255,255,.12); }
@keyframes j-weave-morph{
  0%{ opacity:0; transform:scale(.72); filter:blur(3px) saturate(.65); }
  62%{ opacity:1; transform:scale(1.08); filter:blur(0) saturate(1.08); }
  100%{ opacity:1; transform:scale(1); filter:none; }
}
.j-weave-row.morning .j-weave-meta b{ color:#e7a779; }
.j-weave-row.daylight .j-weave-meta b{ color:#e8c36d; }
.j-weave-row.afterglow .j-weave-meta b{ color:#c6a2c0; }
/* time view v3: hero + blocks (fewer words, more shape) */
.j-hero{ display:flex; gap:8px; align-items:stretch; margin:2px 0 10px; }
.j-ring{ width:74px; height:74px; flex:none; position:relative; }
.j-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.j-ring .pct{ position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; transform:none; }
.j-ring .pct b{ font-family:var(--font-magic); font-size:19px; color:#f4f1ff; line-height:1; }
.j-ring .pct span{ font-size:8.5px; color:var(--ink-dim); letter-spacing:.06em; margin-top:2px; }
.j-tiles{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.j-tile{ background:#ffffff08; border:1px solid #ffffff10; border-radius:12px;
  padding:8px 12px; display:flex; flex-direction:column; justify-content:center; }
.j-tile .v{ font-family:var(--font-magic); font-size:17px; color:#f4f1ff; }
.j-tile .k{ font-size:9.5px; color:var(--ink-dim); letter-spacing:.04em; margin-top:2px; }
.j-tile .k::before{ content:""; display:inline-block; width:7px; height:7px;
  border-radius:50%; margin-right:5px; vertical-align:0; }
.j-tile.deep .k::before{ background:#2fae8f; }
.j-tile.pit .k::before{ background:#c14a6a; }
.j-strip i{ margin-right:1.5px; border-radius:1.5px; }
.j-strip i:last-child{ margin-right:0; }
.j-sessions{ margin-top:6px; display:flex; flex-direction:column; gap:8px; }
.j-sess{ background:#ffffff06; border:1px solid #ffffff0e; border-radius:13px;
  padding:9px 12px 8px; border-left:3px solid #3d3a52; }
.j-sess.deep{ border-left-color:#2fae8f; }
.j-sess.dist{ border-left-color:#c14a6a; }
.j-sess-head{ width:100%; display:flex; align-items:center; gap:9px; margin:0 0 6px;
  padding:3px; border:0; border-radius:7px; color:inherit; background:transparent;
  font:inherit; text-align:left; cursor:pointer; -webkit-appearance:none; }
.j-sess-head:disabled{ cursor:default; }
.j-sess-head:disabled .chev{ visibility:hidden; }
.j-sess-head:focus-visible,.j-expand:focus-visible{ outline:2px solid #2fae8f; outline-offset:2px; }
.j-sess-head .tm{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim);
  font-variant-numeric:tabular-nums; flex:none; }

<script>
let LANG = 'zh';
const tx = (zh, en) => LANG === 'zh' ? zh : en;
function famSetLanguage(lang){
  LANG = lang === 'en' ? 'en' : 'zh';
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = LANG === 'zh' ? 'Mimo 米墨' : 'Mimo';
  const title = document.getElementById('journalTitle');
  if (title) title.textContent = tx('快览', "quick look");
  const badgeMain = document.getElementById('statusBadgeMain');
  if (badgeMain) badgeMain.title = tx('打开快览', 'open quick look');
  const badgeDismiss = document.getElementById('statusBadgeDismiss');
  if (badgeDismiss) {
    badgeDismiss.title = tx('关闭状态提示', 'dismiss status');
    badgeDismiss.setAttribute('aria-label', badgeDismiss.title);
  }
  const refresh = document.getElementById('journalRefreshButton');
  if (refresh) { refresh.title = tx('刷新', 'refresh'); refresh.setAttribute('aria-label', refresh.title); }
  const page = document.getElementById('openPageButton');
  if (page) { page.title = tx('在新页面打开', 'open as a page'); page.setAttribute('aria-label', page.title); }
  const close = document.getElementById('journalCloseButton');
  if (close) { close.title = tx('关闭', 'close'); close.setAttribute('aria-label', close.title); }
  const pomo = document.getElementById('pomoChip');
  if (pomo) pomo.title = tx('结束专注', 'End Focus');
  const focusTimerLabel = document.getElementById('focusTimerLabel');
  if (focusTimerLabel) focusTimerLabel.textContent = tx('专注', 'Focus');
  if (typeof Fam !== 'undefined') {
    const st = statusCopy(Fam.state);
    const status = document.getElementById('statusText');
    if (status) status.textContent = st.label;
    if (document.getElementById('journal')?.classList.contains('on')) renderJournal();
  }
}

/* Mimo DNA output. The compiler supplies identity silhouettes + face anchors;
   the house rig supplies expressions, motion, shadow, and focus. */
function prototypeMascotPack(spec){
  const f = spec.face;
  const forms = Array.isArray(spec.EVOLUTION_BASES) ? spec.EVOLUTION_BASES : [spec.BASE];
  const occupied=[];
  forms.forEach(rows=>rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')occupied.push([x,y])})));
  const xs=occupied.map(p=>p[0]),ys=occupied.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const spanX=maxX-minX+1,spanY=maxY-minY+1,cx=(minX+maxX+1)/2,cy=(minY+maxY+1)/2;
  const pawY=Math.min(maxY-1,f.my+3),pawGap=Math.max(2,spanX*.22);
  const eye = (x, y, ink = 'K', glint = true) => [
    [x,y,ink],[x+1,y,ink],[x,y+1,ink],[x+1,y+1,ink],...(glint ? [[x,y,'W']] : [])
  ];
  const flat = (y, ink = 'K') => [[f.lx,y,ink],[f.lx+1,y,ink],[f.rx,y,ink],[f.rx+1,y,ink]];
  const eyes = {
    idle: [...eye(f.lx,f.y),...eye(f.rx,f.y)],
    focus: [...eye(f.lx,f.y,'K'),...eye(f.rx,f.y,'K'),
      [f.lx,f.y-1,'M'],[f.lx+1,f.y-1,'M'],[f.rx,f.y-1,'M'],[f.rx+1,f.y-1,'M']],
    deep: [...eye(f.lx,f.y,'Q'),...eye(f.rx,f.y,'Q')],
    sleep: flat(f.y+1),
    proud: [[f.lx,f.y+1,'K'],[f.lx+1,f.y,'K'],[f.lx+2,f.y+1,'K'],
      [f.rx-1,f.y+1,'K'],[f.rx,f.y,'K'],[f.rx+1,f.y+1,'K']],

      [f.rx,f.y-1,'S'],[f.rx-1,f.y,'S'],[f.rx,f.y,'S'],[f.rx+1,f.y,'S'],[f.rx,f.y+1,'S']]
  };
  const mouths = {
    w:[[f.mx-1,f.my,'M'],[f.mx+1,f.my,'M']],

  };
  const p = spec.PAL;
  return {
    name:spec.name || 'My little familiar', viewBox:'-1 -2 22 22', BASE:spec.BASE,
    EVOLUTION_BASES:forms,
    shadow:{cx,cy:maxY+1.15,rx:Math.max(3.5,spanX*.4),fill:p.D,op:.27},
    aura:{cx,cy,rx:Math.max(5.5,spanX*.58),ry:Math.max(5.5,spanY*.55)},
    poseOrigin:`${cx}px ${cy}px`, pawColor:p.P,
    paws:[[cx-pawGap,pawY],[cx+pawGap-2,pawY]],
    orb:{x:Math.min(20,maxX+1),y:Math.max(-1,minY-1)},
    zzz:{fill:p.A,pts:[[maxX-.5,minY+3.5],[maxX+1,minY+1.8],[maxX+2.5,minY]]},

    bubbles:[[2,10,.8],[1,12,.6],[3,8,.5]],motes:[[2,6,.7,accent],[20,7,.6,'#b9a8ff'],[5,19,.5,'#fff0c4']],
    PAL:{A:accent,L:accent,P:accent,D:'#241b35',K:'#241b35',W:'#ffffff',M:'#6f4d68'},EYES:{},MOUTHS:{},
    /* State moods live in the SURROUNDINGS (aura, motes, bubbles, opacity) —

      idle:{anim:idleAnim,filter:'drop-shadow(0 5px 7px rgba(28,18,48,.24))',op:1,orb:accent,eye:'',mouth:'',aura:0,auraColor:accent,motes:0},
      focused:{anim:'ffp-raster-breathe 4.1s ease-in-out infinite',filter:`drop-shadow(0 5px 11px ${accent}55)`,op:1,orb:accent,eye:'',mouth:'',aura:.12,auraColor:accent,motes:0,auraPulse:3.6},

/* generic renderer: one persistent DOM, fed by the active mascot's pack */
const Mascot = (() => {
  const shade = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.round(v * 0.55);
    return '#' + ((f(n >> 16 & 255) << 16) | (f(n >> 8 & 255) << 8) | f(n & 255)).toString(16).padStart(6, '0');
  };
  const rectsFor = (pack, list) => list.map(([x, y, ch]) =>
    `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${pack.PAL[ch]}"/>`).join('');
  const bodyFor = (pack, rows) => {
    let body = '', depth = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch !== '.' && pack.PAL[ch]) {
          body  += `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${pack.PAL[ch]}"/>`;
          depth += `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${shade(pack.PAL[ch])}"/>`;
        }
      }
    });
    return { body, depth };
  };
  /* Always draw the approved mature take. The other two cells are generation
     redundancy, not levels the user has to unlock. */
  const MATURE_STAGE = 2;
  const stageForDisplay = () => MATURE_STAGE;

  const rowsForDisplay = (pack) => {
    const forms = pack.EVOLUTION_BASES;
    if (!Array.isArray(forms) || !forms.length) return pack.BASE;
    const index = stageForDisplay();
    return forms[Math.min(index, forms.length - 1)] || pack.BASE;
  };
  const artForDisplay = (pack) => {
    if (pack.RASTER_SHEET) {
      const stage=stageForDisplay();
      // A stage with an expression sheet uses ONLY that sheet: frame 0
      // (NEUTRAL) is its idle art, 1 = JOY, 2 = REST. All three frames share
      // one normalized scale + baseline, so swaps can't jitter.
      const exprSheet=pack.EXPR_SHEETS&&pack.EXPR_SHEETS[String(stage)];
      const sheet=exprSheet||pack.RASTER_SHEET;
      const frame=exprSheet?0:stage;
      return {body:`<g clip-path="url(#ffpRasterClip)"><image id="ffpRasterImg" href="${esc(sheet)}" x="${-22*frame}" y="0" width="66" height="22" preserveAspectRatio="none" style="image-rendering:auto"/></g>`,depth:'',hasExpressions:!!exprSheet};
    }
    return bodyFor(pack,rowsForDisplay(pack));
  };

  let pack = null, refs = null, current = null, walking = false;
  let blinkTimer = null;

  /* Expression frame-swap for raster packs with an expression sheet:
     0 = NEUTRAL (idle art), 1 = JOY, 2 = REST (doubles as the blink frame). */
  function setExpression(frame){
    const img = document.getElementById('ffpRasterImg');
    if (!img || !refs || !refs._full || !refs._full.hasExpressions) return;
    img.setAttribute('x', String(-22 * frame));
    reportCompanionArt(frame);
  }

  /* Tells the native companion layer which art to draw.
     It cannot work this out alone: the base sheet's cells are stages while an
     expression sheet's three cells are NEUTRAL/JOY/REST, so which sheet is in
     play decides what the frame index means, and the expression is chosen
     here. The stage is now always the approved display take. */
  function reportCompanionArt(expressionFrame){
    if (!pack || !pack.RASTER_SHEET) return;
    const stage = stageForDisplay();
    const hasExpressions = !!(refs && refs._full && refs._full.hasExpressions);
    let expression = expressionFrame;
    if (typeof expression !== 'number') {
      const img = document.getElementById('ffpRasterImg');
      expression = img ? Math.round(-parseFloat(img.getAttribute('x') || '0') / 22) : 0;
    }
    const continuousFocus = Fam.continuousFocusMinutes
      ? Fam.continuousFocusMinutes()
      : 0;
    bridge({ type:'companionArt', stage: stage,
             expression: hasExpressions ? expression : 0,
             hasExpressions: hasExpressions,
             /* Mimo's semantic layer. Behavior packs gate on these, so the
                companion goes quiet during deep work by condition rather than
                by a hardcoded rule in Swift. */
             mood: Fam.reflectionActive
               ? 'reflecting'
               : ((typeof Pomo !== 'undefined' && Pomo.timer)
                  ? 'focusSession' : (current || 'idle')),
             focusMinutes: continuousFocus,
             /* Kept as a behavior-pack compatibility field; it is not a
                user-facing streak or reward counter. */
             streakMinutes: continuousFocus });
  }
  function stopBlink(){
    clearTimeout(blinkTimer);
    blinkTimer = null;
  }
  function scheduleBlink(){
    stopBlink();
    if (!refs || !refs._full || !refs._full.hasExpressions || !pack) return;
    const c = pack.CFG[current] || pack.CFG.idle;
    if ((c.exprFrame || 0) !== 0) return;   // a held expression owns the face
    blinkTimer = setTimeout(() => {
      setExpression(2);                      // eyes closed
      blinkTimer = setTimeout(() => {
        setExpression(0);
        scheduleBlink();
      }, 140);
    }, 3000 + Math.random() * 4000);
  }

  function mount(holder, id){
    pack = MASCOTS[id] || MASCOTS.lulu;
    stopBlink();
    // Raster packs render larger than the pixel mascots' 150px box so a
    // full-body figure keeps a readable face.
    const displaySize = pack.displaySize || 150;
    holder.style.width = holder.style.height = displaySize + 'px';
    const stageEl = document.getElementById('stage');
    if (stageEl) stageEl.style.width = displaySize + 'px';
    const badge = document.getElementById('statusBadge');
    if (badge) badge.dataset.anchorHeight = String(displaySize);
    updateStatusBadgeAnchor();
    const aura=pack.aura || {cx:8,cy:8,rx:9,ry:8};
    const paws=pack.paws || [[3,11],[9,11]];
    const displayRows=pack.RASTER_SHEET?null:rowsForDisplay(pack);
    const full=artForDisplay(pack);
    const walkRows=pack.walk&&displayRows?bodyFor(pack,displayRows.slice(0,pack.walk.rows)):null;
    holder.innerHTML = `
    <div class="ffp-wrap" id="ffpWrap">
      <svg viewBox="${pack.viewBox}" width="100%" height="100%" style="display:block;overflow:visible">
        <defs><filter id="psoft-ffp" x="-60%" y="-60%" width="220%" height="220%">

        <ellipse id="ffpAura" cx="${aura.cx}" cy="${aura.cy}" rx="${aura.rx}" ry="${aura.ry}" fill="#ffc964" opacity="0" filter="url(#psoft-ffp)"/>
        <ellipse cx="${pack.shadow.cx}" cy="${pack.shadow.cy}" rx="${pack.shadow.rx}" ry="0.8" fill="${pack.shadow.fill}" opacity="${pack.shadow.op}" filter="url(#psoft-ffp)"/>
        <g id="ffpPose" style="transform:none;transform-origin:${pack.poseOrigin};transition:transform .5s ease">

        <g id="ffpZzz" opacity="0" fill="${pack.zzz.fill}" font-family="monospace" font-weight="700">

          <text x="${pack.zzz.pts[2][0]}" y="${pack.zzz.pts[2][1]}" font-size="2.6" style="animation:ffp-zzz 2.6s ease-out 1.7s infinite">Z</text>
        </g>
        <g id="ffpRings" opacity="0">
          <circle cx="${pack.ring.cx}" cy="${pack.ring.cy}" r="${pack.ring.r}" stroke="#ffb02e" stroke-width="0.5" fill="none" style="animation:ffp-ring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center" stroke-dasharray="1 0.6"/>
          <circle cx="${pack.ring.cx}" cy="${pack.ring.cy}" r="${pack.ring.r}" stroke="#ffe28a" stroke-width="0.3" fill="none" style="animation:ffp-ring 1.4s ease-out .35s infinite;transform-box:fill-box;transform-origin:center" stroke-dasharray="1 0.6"/>
        </g>

          <path d="${pack.sparks[2]}" style="animation:ffp-twinkle 1.5s ease-in-out 1s infinite"/>
        </g>
        <g id="ffpBubbles" opacity="0" fill="#8ee07a">
          <rect x="${pack.bubbles[0][0]}" y="${pack.bubbles[0][1]}" width="${pack.bubbles[0][2]}" height="${pack.bubbles[0][2]}" style="animation:ffp-bubbleUp 2.2s ease-out infinite"/>
          <rect x="${pack.bubbles[1][0]}" y="${pack.bubbles[1][1]}" width="${pack.bubbles[1][2]}" height="${pack.bubbles[1][2]}" style="animation:ffp-bubbleUp 2.2s ease-out .7s infinite"/>
          <rect x="${pack.bubbles[2][0]}" y="${pack.bubbles[2][1]}" width="${pack.bubbles[2][2]}" height="${pack.bubbles[2][2]}" style="animation:ffp-bubbleUp 2.2s ease-out 1.4s infinite"/>
        </g>

          <rect x="${pack.motes[0][0]}" y="${pack.motes[0][1]}" width="${pack.motes[0][2]}" height="${pack.motes[0][2]}" fill="${pack.motes[0][3]}" style="animation:ffp-mote 3.2s ease-in-out infinite"/>
          <rect x="${pack.motes[1][0]}" y="${pack.motes[1][1]}" width="${pack.motes[1][2]}" height="${pack.motes[1][2]}" fill="${pack.motes[1][3]}" style="animation:ffp-mote 3.2s ease-in-out 1.1s infinite"/>
          <rect x="${pack.motes[2][0]}" y="${pack.motes[2][1]}" width="${pack.motes[2][2]}" height="${pack.motes[2][2]}" fill="${pack.motes[2][3]}" style="animation:ffp-mote 3.2s ease-in-out 2.1s infinite"/>

    refs = {};
    for (const id2 of ['ffpWrap','ffpAura','ffpPose','ffpDepth','ffpBody','ffpEyes','ffpMouth','ffpGear',

                       'ffpSparks','ffpBubbles','ffpMotes'])
      refs[id2] = document.getElementById(id2);
    refs._full = full;
    refs._walkRows = walkRows;
    current = null;
    setState('idle');

  }

  function setState(s){
    if (!refs || !pack) return;
    if (s === current) return;
    current = s;
    const c = pack.CFG[s] || pack.CFG.idle;
    const w = refs.ffpWrap;
    w.style.animation = c.anim;
    w.style.filter = c.filter;
    w.style.opacity = c.op;
    refs.ffpAura.setAttribute('fill', c.auraColor);
    refs.ffpAura.setAttribute('opacity', c.aura);
    // focus states breathe the aura (abstract-lane energy around the body)
    refs.ffpAura.style.setProperty('--aura-base', c.aura);
    refs.ffpAura.style.animation = c.auraPulse
      ? `ffp-aura-pulse ${c.auraPulse}s ease-in-out infinite` : 'none';
    refs.ffpPose.style.transform = c.pose || 'none';
    refs.ffpEyes.innerHTML = rectsFor(pack, pack.EYES[c.eye] || []);
    refs.ffpEyes.style.animation = c.blink ? 'ffp-blink 4.6s linear infinite' : 'none';
    refs.ffpMouth.innerHTML = rectsFor(pack, pack.MOUTHS[c.mouth] || []);
    refs.ffpGear.innerHTML = rectsFor(pack, c.gear || []);
    refs.ffpExtras.innerHTML = rectsFor(pack, c.extras || []);
    refs.ffpOrb.setAttribute('fill', c.orb);
    refs.ffpPawL.setAttribute('opacity', c.paws ? 1 : 0);
    refs.ffpPawR.setAttribute('opacity', c.paws ? 1 : 0);
    refs.ffpZzz.setAttribute('opacity', c.zzz ? 1 : 0);
    refs.ffpRings.setAttribute('opacity', c.ring ? 1 : 0);
    refs.ffpSparks.setAttribute('opacity', c.spark ? 1 : 0);
    refs.ffpBubbles.setAttribute('opacity', c.bubbles ? 1 : 0);
    refs.ffpMotes.setAttribute('opacity', c.motes ? 0.9 : 0);
    // walking (Clawd): swap static legs for the animated ones
    if (refs.ffpWalk) {
      refs.ffpWalk.setAttribute('opacity', c.walk ? 1 : 0);
      const src = c.walk ? refs._walkRows : refs._full;
      refs.ffpBody.innerHTML = src.body;
      refs.ffpDepth.innerHTML = src.depth;
    }
    // raster expression frames: hold the state's face, blink while neutral
    if (pack.RASTER_SHEET) {
      setExpression(c.exprFrame || 0);
      scheduleBlink();
    }
    reportCompanionArt();
  }

  return {
    mount, setState,
    has: (s) => !!(pack && pack.CFG[s]),
    id: () => pack ? Object.keys(MASCOTS).find(k => MASCOTS[k] === pack) : null,
  };
})();

/* Fam state → mascot state (design's interaction mapping) */
function mascotStateFor(s){
  if (proudUntil > Date.now()) return 'proud';
  if (Fam.reflectionActive) return 'reflecting';
  const m = { idle: 'idle', focused: 'focused', scholar: 'focused', dizzy: 'dizzy',
              poisoned: 'poisoned', ghost: 'ghost', sleep: 'sleeping' };
  let out = m[s] || 'idle';
  // 25+ minutes of uninterrupted focus selects the calmer deep-work behavior.
  if (out === 'focused' && Fam.continuousFocusMinutes() >= 25) out = 'deepWork';
  // Nat dives for the duration of a Focus timer — goggles stay on unless interrupted.
  if (typeof Pomo !== 'undefined' && Pomo.timer && Mascot.has('snorkel')
      && ['idle', 'focused', 'deepWork'].includes(out)) out = 'snorkel';
  return out;
}

/* ═══ creature + state ═══ */
const Fam = {
  char: 'wisp', state: 'idle',
  reflectionActive: false,
  focusStartedAt: null,
  history: [],          // {app, bundleID, kind, t0, t1}
  cur: null,            // {app, bundleID, kind, t0}
  distractSec: 0, deepSec: 0, switches: [],
  paused: false,
  logGeneration: 0,

  setCharacter(id, persist = true){
    if (!MASCOTS[id]) id = 'lulu';
    this.char = id;
    document.body.dataset.char = 'pixel';
    const holder = document.getElementById('familiar');
    holder.innerHTML = '';
    holder.className = 'familiar char-pixel';
    Mascot.mount(holder, id);
    Mascot.setState(mascotStateFor(this.state));
    if (persist) localStorage.setItem('ff-char', id);
  },

  setState(s){
    if (this.state === s) return;
    this.state = s;
    this.refreshPresentation();
  },

  setReflectionActive(active){
    const next = !!active;
    if (this.reflectionActive === next) return;
    this.reflectionActive = next;
    this.refreshPresentation();
  },

  refreshPresentation(){
    const visibleState = this.reflectionActive ? 'reflecting' : this.state;
    document.body.dataset.state = visibleState;
    Mascot.setState(mascotStateFor(this.state));
    const st = statusCopy(visibleState);
    const badge=document.getElementById('statusBadge');
    badge.classList.remove('focus','distract');
    if(st.cls)badge.classList.add(st.cls);
    document.getElementById('statusText').textContent = st.label;
    famShowStatusBadge();
  },

  continuousFocusMinutes(){
    return this.focusStartedAt
      ? Math.floor((Date.now() - this.focusStartedAt) / 60000)
      : 0;
  },

  sparkle(n){
    const st = document.getElementById('stage');
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.right = (20 + Math.random() * 90) + 'px';
      s.style.bottom = (60 + Math.random() * 60) + 'px';
      s.style.animationDelay = (Math.random() * .35) + 's';
      st.appendChild(s);
      setTimeout(() => s.remove(), 1900);
    }
  },
};

function statusCopy(state){
  return ({
    idle:     { cls: '',         label: tx('发发呆', 'idle') },
    focused:  { cls: 'focus',    label: tx('正在专注', 'focused') },
    scholar:  { cls: 'focus',    label: tx('专注阅读', 'focused · reading') },
    reflecting:{ cls: 'focus',   label: tx('一起回看', 'looking back together') },
    dizzy:    { cls: 'distract', label: tx('有点分心', 'getting distracted') },
    poisoned: { cls: 'distract', label: tx('该缓一缓了', 'time to pause') },
    ghost:    { cls: 'distract', label: tx('注意力飘远了', 'attention wandered') },
  })[state] || { cls:'', label:tx('发发呆','idle') };
}

const STATUS_BADGE_TTL_MS=30000;
let _statusBadgeTimer=null;
function reportStatusBadgeVisibility(on){ bridge({type:'statusBadge',on:!!on}); }
function pauseStatusBadgeDismiss(){
  clearTimeout(_statusBadgeTimer);_statusBadgeTimer=null;
}
function scheduleStatusBadgeDismiss(){
  pauseStatusBadgeDismiss();
  const badge=document.getElementById('statusBadge');
  const journal=document.getElementById('journal');
  if(!badge||badge.classList.contains('is-hidden')||journal?.classList.contains('on'))return;
  _statusBadgeTimer=setTimeout(famDismissStatusBadge,STATUS_BADGE_TTL_MS);
}
function famShowStatusBadge(){
  const badge=document.getElementById('statusBadge');
  if(!badge)return;
  const wasHidden=badge.classList.contains('is-hidden');
  badge.classList.remove('is-hidden');
  badge.setAttribute('aria-hidden','false');
  if(wasHidden)reportStatusBadgeVisibility(true);
  scheduleStatusBadgeDismiss();
}
function famDismissStatusBadge(){
  pauseStatusBadgeDismiss();
  const badge=document.getElementById('statusBadge');
  if(!badge||badge.classList.contains('is-hidden'))return;
  badge.classList.add('is-hidden');
  badge.setAttribute('aria-hidden','true');
  if(badge.contains(document.activeElement))document.activeElement.blur();
  reportStatusBadgeVisibility(false);
}

let _toastT;
function toast(msg,duration=3200){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove('on'), duration);
}

function famNotice(kind,label){
  const prefix=kind==='success'?'✓':kind==='error'?'!':'·';
  toast(`${prefix} ${label}`,8000);
}

/* ═══ focus engine — real-time-ish, slightly accelerated ═══ */
setInterval(() => {
  if (Fam.paused || !Fam.cur) return;
  const kind = Fam.cur.kind;
  if (DEEP_KINDS.has(kind)) {
    Fam.deepSec++; Fam.distractSec = Math.max(0, Fam.distractSec - 2);
    if (!Fam.focusStartedAt) Fam.focusStartedAt = Date.now();
    if (Fam.deepSec === 6) Fam.setState(kind === 'paper' ? 'scholar' : 'focused');
  } else if (kind === 'distraction') {
    Fam.distractSec++; Fam.deepSec = 0; Fam.focusStartedAt = null;
    if (Fam.distractSec === 45)  Fam.setState('dizzy');
    if (Fam.distractSec === 180) Fam.setState('poisoned');
    if (Fam.distractSec === 600) Fam.setState('ghost');
  } else {
    // neutral: corruption wears off, then settle to idle
    Fam.deepSec = 0;
    Fam.focusStartedAt = null;
    if (Fam.distractSec > 0) {
      Fam.distractSec--;
      if (Fam.distractSec <= 120 && ['poisoned','ghost'].includes(Fam.state)) Fam.setState('dizzy');
      if (Fam.distractSec === 0) Fam.setState('idle');
    } else if (Fam.state !== 'idle') {
      Fam.setState('idle');
    }
  }
  // Continuous focus can select deepWork without a Fam state change.
  Mascot.setState(mascotStateFor(Fam.state));
}, 1000);

/* checkpoint: split long open sessions into ≤60s segments on disk, so a
   quit/crash loses at most a minute. aggregate() re-merges them by canonKey. */
setInterval(() => {
  if (Fam.paused || !Fam.cur) return;
  const now = Date.now();
  if (now - Fam.cur.t0 < 60000) return;
  const seg = { ...Fam.cur, t1: now };
  Fam.history.push(seg);
  if (Fam.history.length > 600) Fam.history.shift();
  bridge({ type: 'log', entry: seg, generation: Fam.logGeneration });
  Fam.cur.t0 = now;
}, 15000);

/* ═══ API called from Swift ═══ */
function famSetApp(appName, kind, detail, url, canon, bundleID){
  if (Fam.paused) { Fam.cur = null; return; }
  const now = Date.now();
  if (Fam.cur) {
    Fam.cur.t1 = now;
    Fam.history.push(Fam.cur);
    if (Fam.history.length > 600) Fam.history.shift();
    if (Fam.cur.t1 - Fam.cur.t0 >= 5000) bridge({ type: 'log', entry: Fam.cur, generation: Fam.logGeneration });  // persist to disk
  }
  Fam.cur = { app: appName, bundleID: bundleID || '', kind, detail: detail || '', url: url || '', canon: canon || '', t0: now };
  // Keep the raw switch window for the local journal. Native context policy
  // decides if one quiet nudge is useful; switching is never punished here.
  Fam.switches = Fam.switches.filter(t => now - t < 180000);
  Fam.switches.push(now);
}

function famSetCharacter(id){ Fam.setCharacter(id); toast(MASCOTS[Fam.char].name); }
function famSetReflectionActive(on){ Fam.setReflectionActive(on); }
function famRegisterPrototypePet(spec, select = false){
  MASCOTS.prototype = prototypeMascotPack(spec);
  if (select) Fam.setCharacter('prototype', false);
}
function famSetPrototypePet(spec, celebrate = true){
  famRegisterPrototypePet(spec, true);
  if (celebrate) {
    toast(tx(`${MASCOTS.prototype.name} 住进桌面了 ✦`, `${MASCOTS.prototype.name} joined you ✦`));
    Fam.sparkle(9);
  }
}
function famUnregisterPrototypePet(){
  if(Fam.char==='prototype')Fam.setCharacter('lulu');
  delete MASCOTS.prototype;
  if(localStorage.getItem('ff-char')==='prototype')localStorage.setItem('ff-char','lulu');
}
function famRegisterCustomPet(spec, select=false){
  const id=spec.characterID||(`custom:${spec.id||''}`);
  if(!/^custom:[0-9a-f-]{36}$/i.test(id)||!spec.assetURL)return;
  MASCOTS[id]=rasterMascotPack(spec);
  if(select)Fam.setCharacter(id,false);
}
function famSetCustomPet(spec,celebrate=true){
  famRegisterCustomPet(spec,true);
  if(celebrate){
    toast(tx(`${spec.name||'新伴灵'} 住进桌面了 ✦`,`${spec.name||'Your new familiar'} joined you ✦`));
    Fam.sparkle(9);
  }
}
function famUnregisterCustomPet(id){
  if(!/^custom:[0-9a-f-]{36}$/i.test(id))return;
  if(Fam.char===id)Fam.setCharacter('lulu');
  delete MASCOTS[id];
  if(localStorage.getItem('ff-char')===id)localStorage.setItem('ff-char','lulu');
}
function famPause(p){
  const next=!!p;
  if(next&&!Fam.paused)famIdle(true);
  Fam.paused=next;
  Fam.setState(next?'idle':Fam.state);
}

/* The native companion layer (companion_runtime.swift) renders the familiar
   itself for raster packs, with real physics. When it owns the familiar we
   hide the stage here — otherwise it draws twice and both hosts fight over
   the cursor. The journal, Focus timer, and status badge are unaffected. */
function famSetNativeHosted(on){
  document.body.classList.toggle('native-hosted', !!on);
}
let famDisplayScale=1;
function updateStatusBadgeAnchor(){
  const badge=document.getElementById('statusBadge');
  const base=Math.max(1,Number(badge?.dataset.anchorHeight)||150);
  document.documentElement.style.setProperty('--status-anchor-height',`${base*famDisplayScale}px`);
}
function famSetDisplayScale(value){
  const scale=Math.max(.6,Math.min(1.4,Number(value)||1));
  famDisplayScale=scale;
  document.documentElement.style.setProperty('--fam-display-scale',String(scale));
  updateStatusBadgeAnchor();
}

/* user went idle / screen locked: close the open entry so away-time
   never counts as work. Swift re-sends the frontmost app on return. */
function famIdle(on){
  if (!on || !Fam.cur) return;
  const now = Date.now();
  Fam.cur.t1 = now;
  if (now - Fam.cur.t0 >= 5000) {
    Fam.history.push(Fam.cur);
    if (Fam.history.length > 600) Fam.history.shift();
    bridge({ type: 'log', entry: Fam.cur, generation: Fam.logGeneration });
  }
  Fam.cur = null;
  Fam.deepSec = 0;
  Fam.focusStartedAt = null;
  Fam.setState('idle');
}

/* transient celebration: git commit detected (design: ~5s, then back) */
let proudUntil = 0;
function famProud(label){
  proudUntil = Date.now() + 5000;
  Mascot.setState('proud');
  toast(label || tx('🎉 做出来了！','🎉 shipped!'));
  sound('celebrate');
  setTimeout(() => { proudUntil = 0; Mascot.setState(mascotStateFor(Fam.state)); }, 5200);
}

/* privacy eraser: drop everything tracked since `ts` from working memory
   (Swift rewrites the JSONL on disk) */
function famSetLogGeneration(generation){
  const value=Number(generation);
  if(Number.isSafeInteger(value)&&value>=Fam.logGeneration)Fam.logGeneration=value;
}
function famEraseSince(ts,generation=Fam.logGeneration){
  famSetLogGeneration(generation);
  Fam.history = Fam.history.filter(h => h.t1 <= ts);
  // Native calls this only after the JSONL rewrite has finished. Keep the
  // current app context but start a new-generation segment at that moment.
  if (Fam.cur) Fam.cur = {...Fam.cur, t0:Date.now()};
  Fam.week = (Fam.week || []).filter(h => h.t1 <= ts);
  toast(tx('🫥 已经忘掉了。','🫥 forgotten.'));
}

/* called by Swift on launch with today's persisted entries (JSONL replay) */
function famLoadHistory(entries){
  if (!Array.isArray(entries)) return;
  Fam.history = entries.filter(e => e && e.t0 && e.t1).concat(Fam.history);
  if (Fam.history.length > 600) Fam.history = Fam.history.slice(-600);
}

function bridge(msg){
  try { window.webkit.messageHandlers.bridge.postMessage(msg); } catch(e) {}
}
function sound(name){ bridge({ type: 'sound', name }); }   // Swift plays if Sounds enabled

const DEEP_KINDS = new Set(['deep','code','term','cad','paper','notes']);

/* ── canonicalization: same thing under different names → one entry.
   heuristics for now; an on-device model can slot in at canonKey(). ── */
function normTitle(t){
  return (t || '')
    .replace(/\s*[-–—|·]\s*(YouTube|Google Docs|Google Chrome|GitHub|arXiv|Overleaf|Notion|Reddit|X)\s*$/i, '')
    .replace(/^\(\d+\)\s*/, '')            // "(3) title" notification counts
    .replace(/\.pdf$/i, '')
    .replace(/\s+/g, ' ').trim();
}
function canonKey(h){
  if (h.canon) return 'ai:' + h.canon.toLowerCase();   // on-device model's canonical name
  const arx = (h.url || '').match(/arxiv\.org\/(?:abs|pdf|html)\/(\d{4}\.\d{4,5})/i);
  if (arx) return 'arxiv:' + arx[1];       // 2606.10305 pdf == abs == html page
  const t = normTitle(h.detail);
  return t ? t.toLowerCase() : 'app:' + h.app;
}
function bestLabel(cur, cand){
  if (!cand) return cur;
  if (!cur) return cand;
  const numeric = s => /^[\d.\sv]+$/i.test(s);   // prefer "SARM2: …" over "2606.10305"
  if (numeric(cur) && !numeric(cand)) return cand;
  return cand.length > cur.length ? cand : cur;
}

/* best label per canonical key across ALL history, so a paper first seen
   as "2606.10305" upgrades everywhere once its real title is known */
function labelMap(){
  const m = {};
  for (const h of windowEntries()){
    const k = canonKey(h);
    m[k] = bestLabel(m[k], h.canon || normTitle(h.detail) || h.app);
  }
  return m;
}

/* aggregate history in [w0,w1] into read / built / distracted groups */
function aggregate(w0, w1, labels){
  const groups = {};
  for (const h of windowEntries()){
    const a = Math.max(h.t0, w0), b = Math.min(h.t1, w1);
    if (b - a < 20000) continue;           // ignore <20s touches
    const sec = h.kind === 'distraction' ? 'distracted'
              : h.kind === 'paper' ? 'read'
              : DEEP_KINDS.has(h.kind) ? 'built' : null;
    if (!sec) continue;
    const ck = canonKey(h);
    const key = sec + '|' + ck;
    const g = groups[key] || (groups[key] = { label: '', ms: 0, sec });
    g.ms += b - a;
    g.label = (labels && labels[ck]) || bestLabel(g.label, normTitle(h.detail) || h.app);
  }
  return Object.values(groups);
}

function windowEntries(){
  const now = Date.now();
  return Fam.cur ? [...Fam.history, {...Fam.cur, t1: now}] : [...Fam.history];
}

function rangeStats(w0, now){
  let deep = 0, total = 0;
  for (const h of windowEntries()){
    const a = Math.max(h.t0, w0), b = Math.min(h.t1, now);
    if (b <= a) continue;
    total += b - a;
    if (DEEP_KINDS.has(h.kind)) deep += b - a;
  }
  return { pct: total ? Math.round(100 * deep / total) : 0, deep, total };
}

/* ── segment strip: merged per-activity bars with hover tooltips.
   consecutive checkpoints of the same thing fuse into one bar, so you
   see "Cursor · 20m" not twenty 1-minute stripes. ── */
const fmtDur = ms => {
  const m = Math.max(1, Math.round(ms / 60000));
  return m >= 60 ? `${Math.floor(m/60)}h ${m%60}m` : m + 'm';
};
const fmtClock = t => new Date(t).toTimeString().slice(0, 5);

function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

const KIND_EMOJI = { code:'\u{1F4AA}', term:'\u26D3\uFE0F', cad:'\u{1F4D0}', paper:'\u{1F4D6}',
                     notes:'\u{1F4DD}', neutral:'\u{1F610}', distraction:'\u{1F573}\uFE0F' };

function iconFor(seg){
  let host = '';
  try { host = seg.url ? new URL(seg.url).host.replace('www.', '') : ''; } catch(e) {}
  if (host) return `<img class="fvi" src="https://www.google.com/s2/favicons?domain=${host}&sz=32"` +
    ` onerror="this.outerHTML='<span class=emo>${KIND_EMOJI[seg.kind] || '\u{1F610}'}</span>'">`;
  return `<span class="emo">${KIND_EMOJI[seg.kind] || '\u{1F610}'}</span>`;
}

function mergeSegments(w0, now, labels){
  const segs = windowEntries()
    .map(x => ({ ...x, a: Math.max(x.t0, w0), b: Math.min(x.t1, now) }))
    .filter(x => x.b - x.a > 1000)
    .sort((x, y) => x.a - y.a);
  const merged = [];
  for (const s of segs){
    const key = canonKey(s) + '|' + (DEEP_KINDS.has(s.kind) ? 'deep' : s.kind);
    const last = merged[merged.length - 1];
    if (last && last.key === key && s.a - last.b < 120000) last.b = Math.max(last.b, s.b);
    else merged.push({ a: s.a, b: s.b, sourceT0: s.t0, key, kind: s.kind, url: s.url || '',
                       label: (labels && labels[canonKey(s)]) || normTitle(s.detail) || s.app });
  }
  return merged;
}

function buildStrip(w0, now, labels, { minLabelPct = 12 } = {}){
  const merged = mergeSegments(w0, now, labels);
  if (!merged.length) return '';
  const total = merged.reduce((acc, s) => acc + (s.b - s.a), 0);
  const inner = merged.map(s => {
    const pct = 100 * (s.b - s.a) / total;
    const cls = DEEP_KINDS.has(s.kind) ? 'deep' : s.kind === 'distraction' ? 'dist' : 'neut';
    const tip = `${s.label} — ${fmtDur(s.b - s.a)} · ${fmtClock(s.a)}–${fmtClock(s.b)}`;
    const inline = pct >= minLabelPct ? `<span>${s.label} · ${fmtDur(s.b - s.a)}</span>` : '';
    return `<i class="${cls}" style="width:${pct.toFixed(2)}%" data-tip="${tip.replace(/"/g, '&quot;')}">${inline}</i>`;
  }).join('');
  return `<div class="j-strip" onmousemove="stripTip(event)" onmouseleave="stripTip(null)">${inner}</div>
          <div class="j-strip-cap"><span>${fmtClock(merged[0].a)}</span><span>${tx('现在','now')}</span></div>`;
}

function stripTip(e){
  let tip = document.getElementById('stripTip');
  if (!tip){
    tip = document.createElement('div');
    tip.id = 'stripTip'; tip.className = 'j-tip';
    document.body.appendChild(tip);
  }
  let t = null;
  if (e && e.target && e.target.closest){
    const el = e.target.closest('[data-tip]');
    t = el ? el.dataset.tip : null;
  }
  if (!t){ tip.style.opacity = 0; return; }
  tip.textContent = t;
  tip.style.opacity = 1;
  tip.style.left = Math.max(4, Math.min(e.clientX + 10, innerWidth - 270)) + 'px';
  tip.style.top = Math.max(4, e.clientY - 32) + 'px';
}

const J_NOTES = [
  { min: 70, zh:'今天专注得很稳。✦', en:'a steady, focused day. ✦' },
  { min: 40, zh:'不错——今天的专注节奏还算稳定。', en:'decent — today kept a workable focus rhythm.' },
  { min: 15, zh:'有点摇晃。关掉信息流，回来专注一会儿。', en:'we wobble. close the feed and come back to focus.' },
  { min: 0,  zh:'这一段，我们就不提了。🕳️', en:'we do not speak of this window. 🕳️' },
];

/* Current activity is context; the complete Today report below is the summary. */
function renderNow(){
  const el = document.getElementById('journalNow');
  if (!el) return;
  const now = Date.now();
  const cur = Fam.cur
    ? tx(`你在 <b>${Fam.cur.app}</b>——${fmtDur(now - Fam.cur.t0)}`, `You're in <b>${Fam.cur.app}</b> — ${fmtDur(now - Fam.cur.t0)}`)
    : tx('暂时离开','away');
  el.innerHTML = `<span class="jn-kicker">${tx('此刻','NOW')}</span><div>${cur}</div>`;
}

/* cluster merged segments into sessions (gaps > 10 min split), then
   bullet what happened inside each — shape over words */
function buildSessions(merged){
  const sessions = [];
  for (const m of merged){
    const last = sessions[sessions.length - 1];
    if (last && m.a - last.b <= 10 * 60000){
      last.b = Math.max(last.b, m.b);
      last.anchor = Math.min(last.anchor, m.sourceT0 || m.a);
      last.items.push(m);
    } else {
      sessions.push({ a: m.a, b: m.b, anchor: m.sourceT0 || m.a, items: [m] });
    }
  }
  return sessions;
}

function kindCls(kind){
  return DEEP_KINDS.has(kind) ? 'deep' : kind === 'distraction' ? 'dist' : 'neut';
}

const J_PERIOD_MS = 30 * 60000;

function fmtRailDur(ms){
  if (ms <= 0) return '0m';
  const m = Math.round(ms / 60000);
  return m ? `${m}m` : '<1m';
}

/* Aggregate raw checkpoints directly (rather than merged app segments) so a
   two-minute gap stays visible as blank parchment. */
function collectPeriodEntries(w0, now){
  return windowEntries().map(h => ({
    kind: h.kind,
    a: Math.max(h.t0, w0),
    b: Math.min(h.t1, now)
  })).filter(h => h.b > h.a);
}

function periodBreakdown(a, b, now, entries){
  const liveEnd = Math.min(b, now);
  const elapsed = Math.max(0, Math.min(J_PERIOD_MS, liveEnd - a));
  const ms = { deep: 0, neut: 0, dist: 0 };
  if (elapsed > 0){
    for (const h of entries){
      const overlap = Math.min(h.b, liveEnd) - Math.max(h.a, a);
      if (overlap > 0) ms[kindCls(h.kind)] += overlap;
    }
    // Imported/replayed history can overlap. Preserve its mix but never let a
    // 30-minute stitch paint more than the time that has actually elapsed.
    const raw = ms.deep + ms.neut + ms.dist;
    if (raw > elapsed){
      const scale = elapsed / raw;
      ms.deep *= scale; ms.neut *= scale; ms.dist *= scale;
    }
  }
  const tracked = ms.deep + ms.neut + ms.dist;
  return { ms, elapsed, away: Math.max(0, elapsed - tracked), tracked };
}

function periodCellMarkup(a, b, now, entries, forceCurrent = false, allowCurrent = true){
  const data = periodBreakdown(a, b, now, entries);
  const future = a >= now;
  const current = forceCurrent || (allowCurrent && a <= now && now < b);
  const tip = future
    ? `${fmtClock(a)}–${fmtClock(b)} · ${tx('还没发生','upcoming')}`
    : `${fmtClock(a)}–${fmtClock(b)} · ${fmtRailDur(data.ms.deep)} ${tx('专注','focus')} · ` +
      `${fmtRailDur(data.ms.neut)} ${tx('日常','everyday')} · ${fmtRailDur(data.ms.dist)} ${tx('分心','distracted')}` +
      (data.away >= 30000 ? ` · ${fmtRailDur(data.away)} ${tx('离开','away')}` : '');
  const fill = ['deep', 'neut', 'dist'].map(k => {
    const pct = Math.max(0, Math.min(100, 100 * data.ms[k] / J_PERIOD_MS));
    return pct > .01 ? `<i class="${k}" style="width:${pct.toFixed(2)}%"></i>` : '';
  }).join('');
  return `<div class="j-period${future ? ' future' : ''}${current ? ' is-current' : ''}"
    role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}">
    <span class="j-period-track">${fill}</span></div>`;
}

const WEAVE_BACKGROUND = [247, 238, 219];

function weaveMixColor(data){
  const colors = { deep:[47,174,143], neut:[159,144,122], dist:[193,74,106], away:[232,219,191] };
  const weights = { ...data.ms, away:data.away };
  const sum = Object.values(weights).reduce((a, b) => a + b, 0);
  if (sum <= 0) return [...WEAVE_BACKGROUND];
  return [0,1,2].map(channel => Math.round(Object.entries(weights).reduce(
    (value, [kind, weight]) => value + colors[kind][channel] * weight / sum, 0)));
}

function weaveBlendColor(from, to, amount){
  return from.map((value, channel) => Math.round(value + (to[channel] - value) * amount));
}

function weaveCssColor(rgb){ return `rgb(${rgb.join(',')})`; }

function weavePeriodTip(a, b, now, data){
  if (a >= now) return `${fmtClock(a)}–${fmtClock(b)} · ${tx('还没发生','upcoming')}`;
  return `${fmtClock(a)}–${fmtClock(b)} · ${fmtRailDur(data.ms.deep)} ${tx('专注','focus')} · ` +
    `${fmtRailDur(data.ms.neut)} ${tx('日常','everyday')} · ${fmtRailDur(data.ms.dist)} ${tx('分心','distracted')}` +
    (data.away >= 30000 ? ` · ${fmtRailDur(data.away)} ${tx('离开','away')}` : '');
}

function buildWovenDay(w0, now){
  const entries = collectPeriodEntries(w0, now);
  const noon = new Date(w0); noon.setHours(12, 0, 0, 0);
  const dusk = new Date(w0); dusk.setHours(18, 0, 0, 0);
  const six = new Date(w0); six.setHours(6, 0, 0, 0);
  const dayEnd = new Date(w0); dayEnd.setDate(dayEnd.getDate() + 1);
  const first = entries.length ? Math.min(...entries.map(h => h.a)) : now;
  const last = entries.length ? Math.max(...entries.map(h => h.b)) : now;
  const firstBeforeNoon = entries.some(h => h.a < noon.getTime());
  const boot = Math.max(w0, Math.floor(first / J_PERIOD_MS) * J_PERIOD_MS);
  const morningStart = firstBeforeNoon ? boot : six.getTime();
  const active = !!Fam.cur;
  const eveningVisualEnd = now < dusk.getTime()
    ? dayEnd.getTime()
    : active
      ? Math.floor(now / J_PERIOD_MS) * J_PERIOD_MS + J_PERIOD_MS
      : Math.ceil(Math.max(last, dusk.getTime() + 1) / J_PERIOD_MS) * J_PERIOD_MS;
  const eveningEnd = Math.min(dayEnd.getTime(), Math.max(dusk.getTime() + J_PERIOD_MS, eveningVisualEnd));
  const phases = [
    { id:'morning', icon:'☼', name:tx('晨线','morning thread'), a:morningStart, b:noon.getTime(),
      range:firstBeforeNoon ? `${fmtClock(boot)} → ${tx('中午','noon')}` : tx('安静 → 中午','quiet → noon') },
    { id:'daylight', icon:'☀', name:tx('日织','daylight weave'), a:noon.getTime(), b:dusk.getTime(),
      range:tx('中午 → 18:00','noon → 18:00') },
    { id:'afterglow', icon:'☾', name:tx('暮光','afterglow'), a:dusk.getTime(), b:eveningEnd,
      range:`18:00 → ${now < dusk.getTime() ? tx('稍后','later') : active ? tx('现在','now') : last > dusk.getTime() ? fmtClock(last) : tx('安静','quiet')}` }
  ];
  phases.forEach(phase => {
    phase.count = Math.max(1, Math.ceil((phase.b - phase.a) / J_PERIOD_MS));
  });

  const row = phase => {
    const count = phase.count;
    const periods = [];
    for (let i = 0; i < count; i++){
      const a = phase.a + i * J_PERIOD_MS;
      const b = Math.min(a + J_PERIOD_MS, phase.b);
      const data = periodBreakdown(a, b, now, entries);
      periods.push({ a, b, data, rgb:weaveMixColor(data), future:a >= now });
    }
    // The unknown future is blank parchment, not "neutral" and certainly not
    // black. Let the next three cells carry the current colour gently into the
    // page; phases that have not started yet simply rest in the background.
    const firstFuture = periods.findIndex(period => period.future);
    if (firstFuture >= 0){
      const anchor = firstFuture > 0 ? periods[firstFuture - 1].rgb : WEAVE_BACKGROUND;
      for (let i = firstFuture; i < periods.length; i++){
        const fade = Math.min(1, (i - firstFuture + 1) / 3);
        periods[i].rgb = weaveBlendColor(anchor, WEAVE_BACKGROUND, fade);
      }
    }
    periods.forEach(period => { period.color = weaveCssColor(period.rgb); });
    const tiles = periods.map((period, i) => {
      const prev = periods[Math.max(0, i - 1)].color;
      const next = periods[Math.min(periods.length - 1, i + 1)].color;
      const tip = weavePeriodTip(period.a, period.b, now, period.data);
      const current = active && period.a <= now && now < period.b;
      const bg = `radial-gradient(circle at 28% 20%,rgba(255,255,255,.42),transparent 42%),` +
        `linear-gradient(135deg,${prev} 0%,${period.color} 48%,${next} 100%)`;
      return `<span class="j-weave-cell${current ? ' is-current' : ''}${period.future ? ' is-future' : ''}" style="--i:${i};background:${bg}"
        role="img" data-tip="${esc(tip)}" aria-label="${esc(tip)}"></span>`;
    }).join('');
    return `<div class="j-weave-row ${phase.id}">
      <div class="j-weave-meta"><b>${phase.icon} ${phase.name}</b>
        <span class="range">${phase.range}</span></div>
      <div class="j-weave-rail"><div class="j-weave-thread" style="--period-count:${count}">${tiles}</div></div>
    </div>`;
  };

  return `<div class="j-weave-stack" onmousemove="stripTip(event)" onmouseleave="stripTip(null)">
      ${phases.map(row).join('')}
    </div>`;
}

function buildPeriodRail(w0, now, timeframe){
  if (timeframe >= 1440) return buildWovenDay(w0, now);
  const count = Math.max(1, Math.ceil((now - w0) / J_PERIOD_MS));
  const entries = collectPeriodEntries(w0, now);
  const periods = [];
  for (let i = 0; i < count; i++){
    const a = w0 + i * J_PERIOD_MS;
    const b = Math.min(a + J_PERIOD_MS, now);
    periods.push(periodCellMarkup(a, b, now, entries, i === count - 1));
  }

  const axis = `<div class="j-period-axis"><span>${fmtClock(w0)}</span>` +
    (count > 1 ? `<span>${fmtClock(w0 + J_PERIOD_MS)}</span>` : '') + `<span>${tx('现在','now')}</span></div>`;
  return `<div class="j-period-summary">
      <span class="j-period-title"><b>30m</b> ${tx('一格','periods')}</span>
      <span class="j-period-legend" aria-label="${tx('时间颜色','period colors')}">
        <span><i class="deep"></i>${tx('专注','focus')}</span><span><i class="neut"></i>${tx('日常','everyday')}</span><span><i class="dist"></i>${tx('分心','pit')}</span>
      </span>
    </div>
    <div class="j-period-rail${count > 8 ? ' many' : ''}" style="--period-count:${count}"
      onmousemove="stripTip(event)" onmouseleave="stripTip(null)">${periods.join('')}</div>${axis}`;
}

function renderSessions(merged){
  const sessions = buildSessions(merged).reverse();   // latest on top
  if (!sessions.length) return '';
  return `<div class="j-sessions" onmousemove="stripTip(event)" onmouseleave="stripTip(null)">` +
    sessions.map(sess => {
      // aggregate the session's activities by identity
      const agg = {};
      let deep = 0, dist = 0, neut = 0;
      for (const m of sess.items){
        const d = m.b - m.a;
        const cls = kindCls(m.kind);
        if (cls === 'deep') deep += d; else if (cls === 'dist') dist += d; else neut += d;
        const g = agg[m.key] || (agg[m.key] = { ms: 0, kind: m.kind, url: m.url, label: m.label });
        g.ms += d;
      }
      const total = deep + dist + neut || 1;
      const rows = Object.values(agg).sort((a, b) => b.ms - a.ms);
      // sourceT0 is not clipped by the rolling window, unlike sess.a. Using it
      // keeps this key stable across the click -> rerender cycle.
      const sessId = 's' + sess.anchor;
      const expanded = J.openSess === sessId;
      const shown = expanded ? rows : rows.slice(0, 4);
      const canExpand = rows.length > 4;
      const rowsId = 'jr-' + sessId;
      const domCls = deep >= total * 0.5 ? 'deep' : dist >= total * 0.4 ? 'dist' : '';
      const mini = ['deep', 'neut', 'dist'].map((k, i) => {
        const v = [deep, neut, dist][i];
        return v > 0 ? `<i class="${k}" style="width:${(100 * v / total).toFixed(1)}%"></i>` : '';
      }).join('');
      const headTip = `${fmtClock(sess.a)}–${fmtClock(sess.b)} · ` +
        `${Math.round(100 * deep / total)}% ${tx('专注','focus')}` + (dist > 60000 ? ` · ${fmtDur(dist)} ${tx('掉进分心坑','in the pit')}` : '');
      return `<div class="j-sess ${domCls}">
        <button type="button" class="j-sess-head" data-tip="${esc(headTip)}"
          aria-expanded="${expanded}" aria-controls="${rowsId}"
          ${canExpand ? `onclick="jToggleSess('${sessId}')" onkeydown="jSessKey(event,'${sessId}')"` : 'disabled'}>
          <span class="tm">${fmtClock(sess.a)}–${fmtClock(sess.b)}</span>
          <span class="mini">${mini}</span>
          <span class="du">${fmtDur(sess.b - sess.a)}</span>
          <span class="chev" aria-hidden="true">⌄</span>
        </button><div class="j-sess-rows" id="${rowsId}">` +
        shown.map(g => `<div class="j-li" data-tip="${esc(g.label + ' — ' + fmtDur(g.ms))}">
          <span class="dot ${kindCls(g.kind)}"></span>${iconFor(g)}
          <span class="nm">${esc(g.label)}</span>
          <span class="du">${fmtDur(g.ms)}</span>
        </div>`).join('') + `</div>` +
        (canExpand
          ? `<button type="button" class="j-expand" aria-expanded="${expanded}" aria-controls="${rowsId}"
              onclick="jToggleSess('${sessId}')" onkeydown="jSessKey(event,'${sessId}')">
              <span>${expanded ? tx('收起','show less') : tx(`+ 另外 ${rows.length - 4} 项`,`+ ${rows.length - 4} more`)}</span><span class="arr" aria-hidden="true">⌄</span>
            </button>`
          : '') +
      `</div>`;
    }).join('') + `</div>`;
}

function renderJournal(){
  const hoverTip = document.getElementById('stripTip');
  if (hoverTip) hoverTip.style.opacity = 0;
  renderNow();
  renderTabs();
  if (J.view === 'week')  return renderWeek();

  const now = Date.now();
  const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
  const w0 = dayStart.getTime();
  const labels = labelMap();
  const merged = mergeSegments(w0, now, labels);

  let deep = 0, dist = 0, neut = 0;
  for (const m of merged){
    const d = m.b - m.a;
    if (DEEP_KINDS.has(m.kind)) deep += d;
    else if (m.kind === 'distraction') dist += d;
    else neut += d;
  }
  const total = deep + dist + neut;
  let html = '';
  if (total > 30000){
    const pct = Math.round(100 * deep / total);
    const noteCopy = J_NOTES.find(n => pct >= n.min);
    const note = tx(noteCopy.zh, noteCopy.en);
    const dayHero = `<div class="j-day-summary">
      <span class="sigil">✦</span><b>${tx(`今天 ${pct}% 专注`,`${pct}% focused today`)}</b><span class="sep">·</span>
      <span>${tx(`专注 ${fmtDur(deep)}`,`${fmtDur(deep)} focused`)}</span><span class="sep">·</span>
      <span>${dist > 30000 ? tx(`${fmtDur(dist)} 散线`,`${fmtDur(dist)} frayed`) : tx('线织得很干净','a clean thread')}</span><span class="sep">·</span>
      <span>${tx(`记下 ${fmtDur(total)}`,`${fmtDur(total)} recorded`)}</span>
    </div>`;
    html += dayHero +
      buildPeriodRail(w0, now, 1440) +
      renderSessions(merged) +
      `<div class="j-note" style="margin-top:8px">${note}</div>`;
  }
  document.getElementById('journalBody').innerHTML =
    (html || `<div class="j-empty">${tx('这一页还是空的。<br>去做点什么、读点什么、拆点什么——<br>我会替你记下来。✦',"the pages for this window are blank.<br>go build something, read something, break something —<br>i'll write it down. ✦")}</div>`) + reflectionBrowserEntry();
}

/* ── week view: hour-by-day heatmap + per-day focus bars ── */
function famLoadWeek(entries){ Fam.week = Array.isArray(entries) ? entries : []; }

function renderWeek(){
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (6 - i)); return d;
  });
  const dayMs = 86400000;
  // past days come from famLoadWeek (yesterday and older); today from live history
  const all = [...(Fam.week || []), ...windowEntries()];
  // cells[day][hour] = {deep, dist}; daily totals
  const cells = days.map(() => [...Array(24)].map(() => ({ deep: 0, dist: 0 })));
  const totals = days.map(() => ({ deep: 0, dist: 0, neut: 0 }));
  for (const h of all){
    if (!h.t0 || !h.t1) continue;
    for (let di = 0; di < 7; di++){
      const d0 = days[di].getTime(), d1 = d0 + dayMs;
      const a = Math.max(h.t0, d0), b = Math.min(h.t1, d1);
      if (b <= a) continue;
      const deep = DEEP_KINDS.has(h.kind), dist = h.kind === 'distraction';
      if (deep) totals[di].deep += b - a; else if (dist) totals[di].dist += b - a; else totals[di].neut += b - a;
      // split into hour buckets
      let t = a;
      while (t < b){
        const hr = new Date(t).getHours();
        const hrEnd = Math.min(b, new Date(t).setMinutes(59, 59, 999) + 1);
        if (deep) cells[di][hr].deep += hrEnd - t;
        else if (dist) cells[di][hr].dist += hrEnd - t;
        t = hrEnd;
      }
    }
  }
  const dayName = d => (LANG === 'zh' ? ['日','一','二','三','四','五','六'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'])[d.getDay()] + (d.toDateString() === new Date().toDateString() ? '·' : '');
  let grid = '';
  days.forEach((d, di) => {
    grid += `<div class="wk-day">${dayName(d)}</div>`;
    for (let hr = 0; hr < 24; hr++){
      const c = cells[di][hr];
      let style = '';
      if (c.dist > c.deep && c.dist > 3 * 60000) style = `background:rgba(193,74,106,${Math.min(.9, .25 + c.dist / 3600000)})`;
      else if (c.deep > 60000) style = `background:rgba(47,174,143,${Math.min(.95, .2 + c.deep / 3600000)})`;
      const tip = `${dayName(d)} ${String(hr).padStart(2,'0')}:00 — ${fmtDur(c.deep)} ${tx('专注','focus')}${c.dist > 60000 ? ', ' + fmtDur(c.dist) + tx(' 分心',' distracted') : ''}`;
      grid += `<div class="wk-cell" style="${style}" data-tip="${c.deep + c.dist > 60000 ? tip : ''}"></div>`;
    }
  });
  let dayLines = '';
  days.forEach((d, di) => {
    const t = totals[di], tot = t.deep + t.dist + t.neut;
    if (!tot) return;
    dayLines += `<div class="wk-dayline"><span class="n">${dayName(d)}</span>
      <span class="wk-bar">
        <i style="width:${100*t.deep/tot}%;background:#2fae8f"></i>
        <i style="width:${100*t.neut/tot}%;background:#3d3a52"></i>
        <i style="width:${100*t.dist/tot}%;background:#c14a6a"></i></span>
      <span class="v">${fmtDur(t.deep)} · ${Math.round(100*t.deep/tot)}%</span></div>`;
  });
  document.getElementById('journalBody').innerHTML = `
    <div class="wk-grid" onmousemove="stripTip(event)" onmouseleave="stripTip(null)">${grid}</div>
    <div class="wk-legend"><span><i style="background:rgba(47,174,143,.7)"></i>${tx('专注','focus')}</span>
      <span><i style="background:rgba(193,74,106,.6)"></i>${tx('分心','distracted')}</span><span>${tx('0–23 点 →','hours 0–23 →')}</span></div>
    <div class="wk-days">${dayLines || `<div class="j-empty">${tx('目前只有一天的数据；这一周会慢慢长出来。','one day of data so far — the map fills in as the week goes.')}</div>`}</div>
    ${reflectionBrowserEntry()}`;
}

/* ── Focus timer ── */
const Pomo = { until: 0, dur: 0, timer: null, wounded: false };

function famPomodoro(min){
  if (Pomo.timer){ endPomo(false); return; }        // toggle = call off
  if (!min) return;
  Pomo.dur = min * 60000;
  Pomo.until = Date.now() + Pomo.dur;
  Pomo.wounded = false;
  document.getElementById('pomoWrap').classList.add('on');
  Pomo.timer = setInterval(pomoTick, 1000);
  reportCompanionArt();
  toast(tx(`专注开始——${min} 分钟`,`Focus started — ${min} minutes`));
  sound('focus');
  pomoTick();
}
function pomoTick(){
  const left = Pomo.until - Date.now();
  if (left <= 0) return endPomo(true);
  const mm = Math.floor(left / 60000), ss = Math.floor(left % 60000 / 1000);
  document.getElementById('pomoTime').textContent = `${mm}:${String(ss).padStart(2, '0')}`;
  document.getElementById('pomoFill').style.width = (100 * (1 - left / Pomo.dur)).toFixed(1) + '%';
  if (Fam.cur && Fam.cur.kind === 'distraction' && !Pomo.wounded){
    Pomo.wounded = true;
    Fam.setState('poisoned');
    toast(tx('有点分心了——回来继续专注','A distraction interrupted Focus — come back'));
    sound('poison');
  }
}
function endPomo(success){
  clearInterval(Pomo.timer); Pomo.timer = null;
  document.getElementById('pomoWrap').classList.remove('on');
  const completed=success&&!Pomo.wounded;
  if (completed){ toast(tx('✓ 专注完成','✓ Focus complete')); Fam.sparkle(7); sound('focus'); }
  else if (success){ toast(tx('✓ 计时完成，专注有过中断','✓ Focus timer complete, with an interruption')); }
  else toast(tx('专注已结束','Focus ended'));
  reportCompanionArt();
  if(completed)bridge({type:'companionEvent',event:'focusComplete'});
}

  const w0 = dayStart.getTime();
  const labels = labelMap();

  .page .meta{ color:#9d97b8; font-size:13.5px; margin-bottom:24px; }

  .page{ --ink-dim:#b9b3d6; }

  j.classList.remove('on');
  stage.classList.remove('journal-open');
  if(badgeMain){ badgeMain.setAttribute('aria-expanded','false'); badgeMain.title=tx('打开快览','open quick look'); }
  scheduleStatusBadgeDismiss();
  bridge({ type: 'bubble', on: false });
}

function famShowJournal(){
  const j = document.getElementById('journal');
  const stage = document.getElementById('stage');
  const badgeMain = document.getElementById('statusBadgeMain');
  J.view='today';J.openSess=null;
  renderJournal();

function famToggleJournal(){
