<!doctype html>
<!-- PROTOTYPE — throwaway. Three design directions for the Today Journal journey graph.
     Switch with ?variant=A|B|C (&data=dense|sparse), the floating bar, or ←/→ keys. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journey Graph 原型 · 甲手卷 / 乙庭园 / 丙册页</title>
<style>
:root{
  color-scheme:light;
  --paper:#f5f1e9;--paper-2:#fffdf8;--ink:#302d29;--muted:#7d766d;
  --line:#ddd5c8;--line-soft:#eee7dc;--accent:#8b563e;--accent-soft:#f2e8df;
  --building:#a9583d;--learning:#577d70;--communication:#99743e;
  --planning:#716c9b;--admin:#8a8176;--entertainment:#a36773;
  --seal:#a03c2e; /* 朱砂 — only for 印章 */
  --shadow:0 1px 0 rgba(55,47,38,.025);--radius:20px;
  --serif:Georgia,"Songti SC",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
body{font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
/* ── host context (simplified from reflection.html) ── */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:rgba(245,241,233,.94);border-bottom:1px solid rgba(221,214,202,.72);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font:600 15px var(--serif)}
.brand h1{font:600 18px/1 var(--serif);margin:0}
.proto-tag{color:var(--muted);font-size:10px;letter-spacing:.06em}
main{max-width:1200px;margin:0 auto;padding:24px 28px 96px}
.card{background:var(--paper-2);border:1px solid rgba(221,213,200,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:20px 26px;margin-bottom:16px;display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero h2{font:600 26px/1.15 var(--serif);margin:0;letter-spacing:-.02em}
.hero-metrics{display:flex;gap:26px;color:var(--muted);font-size:11px;white-space:nowrap}
.hero-metrics strong{display:block;font:600 19px/1.2 var(--serif);color:var(--ink)}
.stage{margin-bottom:16px;padding:20px 22px}
.stage-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px}
.stage-head h3{display:flex;align-items:center;gap:8px;margin:0;font:600 15px/1.2 var(--serif)}
.stage-head small{color:var(--muted);font-size:10px}
.ribbon{display:flex;gap:5px;margin-top:14px}
.ribbon i{flex:1;height:7px;border-radius:99px;background:var(--line-soft)}
.ribbon i.on{background:color-mix(in srgb,var(--c,var(--admin)),white 35%)}
/* ── seals (shared) ── */
.seal{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 3px;border-radius:4px;background:var(--seal);color:#fdf8f2;font:700 8.5px/1 var(--mono);letter-spacing:.02em;transform:rotate(-3deg);box-shadow:0 1px 2px rgba(120,38,26,.25)}
.seal.lg{min-width:20px;height:20px;font-size:9.5px;border-radius:5px}
/* ── variant A 手卷 ── */
.scroll-wrap{position:relative;border:1px solid var(--line-soft);border-radius:16px;background:linear-gradient(180deg,rgba(255,253,248,.9),rgba(250,246,238,.75));overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.scroll-scene{position:relative;height:320px}
.scroll-scene svg{position:absolute;inset:0;overflow:visible}
.stop-label{position:absolute;transform:translateX(-50%);max-width:150px;text-align:center;pointer-events:none;transition:opacity .18s}
.stop-label b{display:block;font:600 12.5px/1.25 var(--serif);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-label span{display:block;margin-top:1px;color:var(--muted);font-size:9px}
.stop-label .seal{position:static;display:inline-flex;vertical-align:-3px;margin-left:4px}
.stop-hit{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;padding:0}
.scroll-scene.dimmed .stop-label,.scroll-scene.dimmed .a-stop{opacity:.16}
.scroll-scene.dimmed .stop-label.lit,.scroll-scene.dimmed .a-stop.lit{opacity:1}
.scroll-scene.dimmed .a-ink{opacity:.14}
.a-thread{stroke:var(--accent);stroke-width:1.1;fill:none;stroke-dasharray:2 5;opacity:0;transition:opacity .18s}
.a-thread.lit{opacity:.7}
.rest-mark{position:absolute;top:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:9.5px;text-align:center;letter-spacing:.12em;writing-mode:vertical-rl;opacity:.8}
.a-tick{position:absolute;bottom:8px;transform:translateX(-50%);color:var(--muted);font:500 9px var(--mono);opacity:.65}
.a-cap{position:absolute;top:18px;color:var(--accent);font:600 10px/1.6 var(--serif);letter-spacing:.14em;writing-mode:vertical-rl}
/* ── variant B 庭园 ── */
.garden{position:relative;border:1px solid var(--line-soft);border-radius:16px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.85),rgba(250,246,238,.6) 70%);overflow:hidden}
.garden svg{position:absolute;inset:0;overflow:visible}
.stone{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;text-align:center;border:0;background:transparent;padding:0;transition:opacity .2s,filter .2s}
.stone-core{max-width:100%;padding:4px 10px}
.stone b{display:block;font:600 var(--stone-font,13px)/1.22 var(--serif);letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stone span{display:block;margin-top:2px;color:var(--muted);font-size:9.5px}
.stone .visits{display:flex;gap:3px;justify-content:center;margin-top:4px}
.stone .visits i{width:3.5px;height:3.5px;border-radius:50%;background:var(--c);opacity:.65}
.stone .seal{position:absolute;top:10%;right:8%}
.garden.dimmed .stone{opacity:.28;filter:saturate(.4)}
.garden.dimmed .stone.lit{opacity:1;filter:none}
.garden.dimmed .b-trail{opacity:.08}
.garden.dimmed .b-trail.lit{opacity:.6}
.b-rest{position:absolute;transform:translate(-50%,-50%);color:var(--muted);font-size:9px;letter-spacing:.1em;white-space:nowrap;background:rgba(250,247,240,.85);padding:2px 7px;border-radius:99px;border:1px dashed var(--line)}
.stone{cursor:grab}
.stone.dragging{cursor:grabbing;z-index:30;opacity:.9;transition:none}
.stone.drop-hint .stone-core{outline:2px dashed var(--accent);outline-offset:8px;border-radius:50%}
.stone.selected .stone-core{outline:1.5px solid color-mix(in srgb,var(--c),white 30%);outline-offset:10px;border-radius:50%}
.stone b[contenteditable]{outline:1.5px dashed var(--accent);outline-offset:3px;border-radius:4px;min-width:40px}
.garden-detail{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 13px;border:1px solid var(--line-soft);border-radius:12px;background:linear-gradient(110deg,rgba(139,86,62,.045),rgba(87,125,112,.025));font-size:11px}
.garden-detail b{font:600 13.5px/1.3 var(--serif)}
.garden-detail .visit-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)),white 90%);color:color-mix(in srgb,var(--c,var(--accent)),black 18%);font:600 10px var(--mono)}
.garden-detail .visit-arrow{color:var(--line);font-size:10px}
.garden-detail .hint{margin-left:auto;color:var(--muted);font-size:9.5px}
.garden-hint{margin-top:8px;text-align:center;color:var(--muted);font-size:9.5px;letter-spacing:.05em;opacity:.85}
.toast{position:fixed;right:22px;bottom:24px;z-index:98;display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);box-shadow:0 12px 30px rgba(54,43,31,.14);font-size:11.5px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:11px;padding:2px 4px}
/* ── variant C 册页 ── */
.leaf{max-width:660px;margin:0 auto;padding:6px 4px 10px}
.leaf-head{text-align:center;margin:4px 0 26px}
.leaf-head .date-seal{display:inline-block;margin-bottom:10px}
.leaf-head h4{font:600 21px/1.3 var(--serif);margin:0;letter-spacing:.01em}
.leaf-head p{margin:6px 0 0;color:var(--muted);font-size:10.5px;letter-spacing:.08em}
.chapter{display:grid;grid-template-columns:66px minmax(0,1fr);gap:14px;padding:11px 0;position:relative}
.chapter time{font:600 11px/2 var(--mono);color:var(--accent);text-align:right}
.chapter-body{min-width:0;position:relative;padding-left:18px}
.chapter-body:before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--admin));opacity:.85}
.chapter-body:after{content:"";position:absolute;left:3px;top:20px;bottom:-14px;width:1px;background:var(--line-soft)}
.chapter:last-of-type .chapter-body:after{display:none}
.chapter h5{display:inline-block;font:600 16.5px/1.35 var(--serif);margin:0;letter-spacing:-.01em}
.chapter h5 svg{display:block;margin-top:1px;width:100%;height:5px;overflow:visible}
.chapter h5 path{fill:none;stroke:var(--c,var(--admin));stroke-width:1.6;stroke-linecap:round;opacity:.55}
.chapter .meta{margin-top:4px;color:var(--muted);font-size:10.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chapter .meta .again{color:var(--accent)}
.chapter .meta .seal{transform:rotate(-3deg) scale(.92)}
.ink-bar{height:4px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--admin)),white 55%);opacity:.75}
.frag{color:var(--muted);font-size:12px;line-height:1.7}
.frag i{font-style:normal;color:var(--ink);font-weight:600}
.frag .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.7;margin:0 4px 0 10px;vertical-align:1px}
.rest-row{padding:16px 0;text-align:center;color:var(--muted);font-size:10.5px;letter-spacing:.28em}
.rest-row:before,.rest-row:after{content:"◦ ◦ ◦";margin:0 14px;letter-spacing:.4em;opacity:.5}
.leaf-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line-soft);text-align:center;color:var(--muted);font-size:10.5px;letter-spacing:.06em}
/* ── switcher ── */
.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:2px;padding:5px;border-radius:99px;background:rgba(40,36,31,.92);color:#f2ede4;box-shadow:0 10px 30px rgba(30,24,18,.35);backdrop-filter:blur(10px)}
.switcher button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:99px;font-size:12px}
.switcher button:hover{background:rgba(255,255,255,.12)}
.switcher .label{min-width:120px;text-align:center;font:600 12px/1 var(--serif);letter-spacing:.05em}
.switcher .sep{width:1px;height:16px;background:rgba(255,255,255,.18);margin:0 4px}
.switcher .data-btn{font-size:10.5px;opacity:.75}
.switcher .data-btn.on{opacity:1;background:rgba(255,255,255,.16)}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark">M</div><h1>今日手记</h1></div>
  <span class="proto-tag">PROTOTYPE · journey graph 设计方向</span>
</header>
<main>
  <section class="card hero">
    <h2 id="heroTitle">今天主要在把 Mimo 从"记录"推进到"理解"</h2>
    <div class="hero-metrics" id="heroMetrics"></div>
  </section>
  <section class="card stage">
    <div class="stage-head">
      <h3><span id="stageIcon">﹏</span><span id="stageTitle">一天的节奏</span></h3>
      <small id="stageNote"></small>
    </div>
    <div id="stageBody"></div>
    <div class="ribbon" id="ribbon"></div>
  </section>
</main>
<nav class="switcher" id="switcher">
  <button id="prevBtn" aria-label="上一个">‹</button>
  <span class="label" id="variantLabel"></span>
  <button id="nextBtn" aria-label="下一个">›</button>
  <span class="sep"></span>
  <button class="data-btn" data-data="dense">密集日</button>
  <button class="data-btn" data-data="sparse">轻量日</button>
</nav>
<script>
/* ───────────────────────── data ───────────────────────── */
const COLORS={building:'#a9583d',learning:'#577d70',communication:'#99743e',planning:'#716c9b',admin:'#8a8176',entertainment:'#a36773'};
const CAT_LABEL={building:'创作',learning:'学习',communication:'沟通',planning:'规划',admin:'事务',entertainment:'娱乐'};
function makeDense(){
  const day=new Date();day.setHours(8,30,0,0);let t=day.getTime(),id=0;
  const idents={
    learning:[['arxiv.org','读 agent 论文'],['news.ycombinator.com','逛 Hacker News'],['docs.swift.org','查 Swift 文档']],
    building:[['Cursor','Mimo 路径图'],['Xcode','伙伴窗口'],['Terminal','构建脚本']],
    communication:[['WeChat','和团队聊产品'],['Mail','清理收件箱']],
    planning:[['Notion','周计划'],['Calendar','排日程']],
    admin:[['Finder','整理文件'],['System Settings','折腾权限']],
    entertainment:[['youtube.com','听歌'],['bilibili.com','看视频']]};
  const script=[['building',0,40],['learning',0,18],['building',0,35],['communication',0,8],['building',1,25],['learning',1,12],['building',0,30],['gap',0,90],['communication',0,15],['planning',0,20],['building',0,45],['learning',2,10],['building',2,15],['admin',0,6],['building',0,25],['communication',1,10],['learning',0,22],['building',1,18],['entertainment',0,12],['planning',1,8],['building',0,38],['learning',1,9],['communication',0,7],['building',2,20],['admin',1,5],['building',0,28],['learning',0,14],['entertainment',1,15],['building',1,22],['communication',0,9],['planning',0,12],['building',0,33],['learning',2,11],['building',0,17],['communication',1,6],['admin',0,7],['building',2,19],['learning',0,13],['building',0,26],['entertainment',0,10]];
  const blocks=[];
  for(const[cat,i,mins]of script){
    if(cat==='gap'){t+=mins*60000;continue}
    const[app,title]=idents[cat][i];
    blocks.push({id:'b'+(++id),title,category:cat,startMS:t,endMS:t+mins*60000,seconds:Math.round(mins*60*.85),identity:app});
    t+=mins*60000+2*60000;
  }
  const prior={'building|Cursor':3,'learning|arxiv.org':2,'communication|WeChat':5,'planning|Notion':1};
  return{name:'dense',headline:'密集的一天:在构建与阅读之间来回',blocks,prior};
}
function makeSparse(){
  const day=new Date();day.setHours(8,30,0,0);const t=m=>day.getTime()+m*60000;
  const blocks=[
    {id:'s1',title:'Activity tracking 作为 sensemaking',category:'learning',startMS:t(0),endMS:t(18),seconds:18*60,identity:'arxiv.org'},
    {id:'s2',title:'Mimo 今日手记',category:'building',startMS:t(20),endMS:t(60),seconds:40*60,identity:'Cursor'},
    {id:'s3',title:'和团队聊产品',category:'communication',startMS:t(175),endMS:t(187),seconds:12*60,identity:'WeChat'},
    {id:'s4',title:'数据系统笔记',category:'learning',startMS:t(250),endMS:t(278),seconds:28*60,identity:'Preview'},
    {id:'s5',title:'回到 arXiv 接着读',category:'learning',startMS:t(390),endMS:t(407),seconds:17*60,identity:'arxiv.org'}];
  return{name:'sparse',headline:'轻量的一天,留了很多白',blocks,prior:{'learning|arxiv.org':2}};
}
/* ───────────────────────── shared model ───────────────────────── */
function buildModel(data){
  const topics=new Map();
  for(const b of data.blocks){
    const key=b.category+'|'+b.identity;
    if(!topics.has(key))topics.set(key,{key,category:b.category,identity:b.identity,label:b.title,labelSec:0,seconds:0,blocks:[],firstMS:b.startMS,lastMS:b.endMS,prior:data.prior[key]||0});
    const tp=topics.get(key);
    tp.seconds+=b.seconds;tp.blocks.push(b);tp.lastMS=Math.max(tp.lastMS,b.endMS);
    if(b.seconds>tp.labelSec){tp.labelSec=b.seconds;tp.label=b.title}
  }
  // stays: consecutive blocks of the same topic merged
  const stays=[];
  for(const b of [...data.blocks].sort((x,y)=>x.startMS-y.startMS)){
    const key=b.category+'|'+b.identity,last=stays[stays.length-1];
    if(last&&last.key===key&&b.startMS-last.endMS<12*60000){last.endMS=b.endMS;last.seconds+=b.seconds}
    else stays.push({key,topic:topics.get(key),category:b.category,startMS:b.startMS,endMS:b.endMS,seconds:b.seconds,title:b.title});
  }
  const visitCount=new Map();
  for(const s of stays){const n=(visitCount.get(s.key)||0)+1;visitCount.set(s.key,n);s.visit=n}
  for(const[key,n]of visitCount)topics.get(key).visits=n;
  // sequence with rests (>30min wall-clock gap)
  const seq=[];
  stays.forEach((s,i)=>{
    if(i){const gap=s.startMS-stays[i-1].endMS;if(gap>30*60000)seq.push({type:'rest',minutes:Math.round(gap/60000)})}
    seq.push({type:'stay',stay:s});
  });
  return{topics:[...topics.values()],stays,seq,total:data.blocks.reduce((a,b)=>a+b.seconds,0)};
}
/* helpers */
const fmtT=ms=>new Date(ms).toTimeString().slice(0,5);
const fmtD=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)}小时${m%60?`${String(m%60).padStart(2,'0')}分`:''}`:`${m}分钟`};
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seedStr){let h=2166136261;for(const c of seedStr)h=(h^c.charCodeAt(0))*16777619>>>0;return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;h>>>=0;return(h%1000)/1000}}
function curve(points){ /* catmull-rom → bezier */
  if(points.length<2)return'';
  let d=`M ${points[0][0]} ${points[0][1]}`;
  for(let i=0;i<points.length-1;i++){
    const p0=points[Math.max(0,i-1)],p1=points[i],p2=points[i+1],p3=points[Math.min(points.length-1,i+2)];
    d+=` C ${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6}, ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function wobble(x1,x2,y,seed){ /* hand-drawn underline */
  const r=rng(seed),n=Math.max(2,Math.round((x2-x1)/26)),pts=[];
  for(let i=0;i<=n;i++)pts.push([x1+(x2-x1)*i/n,y+(r()-.5)*2.4]);
  return curve(pts);
}
/* ───────────────────────── variant A 手卷 ───────────────────────── */
function renderScroll(model,host){
  const H=320,LANES={entertainment:74,communication:104,admin:130,planning:158,learning:196,building:244};
  const items=[];let x=92;
  for(const it of model.seq){
    if(it.type==='rest'){items.push({type:'rest',x:x+30,minutes:it.minutes});x+=78;continue}
    const w=Math.max(58,Math.min(190,34+it.stay.seconds/60*2.1));
    items.push({type:'stay',stay:it.stay,x:x+w/2,w});x+=w;
  }
  const W=Math.max(x+110,host.clientWidth-2);
  const stops=items.filter(i=>i.type==='stay').map(i=>{
    const r=rng('y'+i.stay.key+i.stay.visit);
    return{...i,y:LANES[i.stay.category]+(r()-.5)*14};
  });
  // ink line: through stops, broken at rests
  let segs=[],cur=[];
  for(const it of items){
    if(it.type==='rest'){if(cur.length)segs.push(cur);cur=[]}
    else cur.push(stops.find(s=>s.stay===it.stay));
  }
  if(cur.length)segs.push(cur);
  const inkPaths=segs.map(seg=>`<path class="a-ink" d="${curve(seg.map(s=>[s.x,s.y]))}" fill="none" stroke="#302d29" stroke-width="1.5" opacity=".5" stroke-linecap="round"/>`).join('');
  const restBridges=[];
  segs.forEach((seg,i)=>{if(i){const a=segs[i-1][segs[i-1].length-1],b=seg[0];restBridges.push(`<path d="M ${a.x+8} ${a.y} C ${(a.x+b.x)/2} ${Math.min(a.y,b.y)-26}, ${(a.x+b.x)/2} ${Math.min(a.y,b.y)-26}, ${b.x-8} ${b.y}" fill="none" stroke="#b8afa3" stroke-width="1.1" stroke-dasharray="1 6" opacity=".7" stroke-linecap="round"/>`)}});
  // stops: ink dots sized by dwell; wash behind long stays
  const dots=stops.map((s,i)=>{
    const r=3+Math.min(8.5,s.stay.seconds/60*.16),c=COLORS[s.stay.category];
    const wash=s.stay.seconds>=25*60?`<circle cx="${s.x}" cy="${s.y}" r="${r*2.6}" fill="${c}" opacity=".1"/>`:'';
    const ring=s.stay.visit>1?`<circle cx="${s.x}" cy="${s.y}" r="${r+3.5}" fill="none" stroke="${c}" stroke-width="1" opacity=".5" stroke-dasharray="2 3"/>`:'';
    return`${wash}${ring}<circle class="a-stop" data-stop="${i}" cx="${s.x}" cy="${s.y}" r="${r}" fill="${c}" opacity=".92"/>`;
  }).join('');
  // topic threads (revealed on hover)
  const byTopic=new Map();
  stops.forEach((s,i)=>{if(!byTopic.has(s.stay.key))byTopic.set(s.stay.key,[]);byTopic.get(s.stay.key).push(s)});
  const threads=[...byTopic.entries()].filter(([,v])=>v.length>1).map(([key,v])=>`<path class="a-thread" data-thread="${esc(key)}" d="${v.map((s,i)=>`${i?'L':'M'} ${s.x} ${s.y}`).join(' ')}"/>`).join('');
  // labels: only stays ≥8min or first visit; side by lane, two tiers per side,
  // drop the label (dot keeps the story) when both tiers are occupied
  const tierEnd={above:[-1e9,-1e9],below:[-1e9,-1e9]};
  const labels=stops.map((s,i)=>{
    if(s.stay.seconds<8*60&&s.stay.visit>1)return'';
    const text=s.stay.visit>1?s.stay.topic.label:s.stay.title;
    const w=Math.min(150,18+text.length*13);
    const side=s.y>=170?'above':'below',tiers=tierEnd[side];
    let tier=0;
    if(s.x-w/2<tiers[0]+10){tier=1;if(s.x-w/2<tiers[1]+10){if(s.stay.seconds<15*60)return'';tier=tiers[0]<=tiers[1]?0:1}}
    tiers[tier]=s.x+w/2;
    const y=side==='above'?s.y-(tier?76:47):s.y+(tier?46:16);
    const seal=(s.stay.visit===1&&s.stay.topic.prior)?`<span class="seal">↺${s.stay.topic.prior}</span>`:'';
    const again=s.stay.visit>1?` · 又来`:'';
    return`<span class="stop-label" data-stoplab="${i}" data-key="${esc(s.stay.key)}" style="left:${s.x}px;top:${y}px"><b>${esc(text)}</b><span>${fmtD(s.stay.seconds)}${again}${seal}</span></span>`;
  }).join('');
  const rests=items.filter(i=>i.type==='rest').map(i=>`<span class="rest-mark" style="left:${i.x}px">休 · ${fmtD(i.minutes*60)}</span>`).join('');
  // hour ticks at first stop after each hour change
  let lastHour=-1;
  const ticks=stops.map(s=>{const h=new Date(s.stay.startMS).getHours();if(h===lastHour)return'';lastHour=h;return`<span class="a-tick" style="left:${s.x}px">${String(h).padStart(2,'0')}:00</span>`}).join('');
  const caps=`<span class="a-cap" style="left:26px">起 · ${fmtT(model.stays[0].startMS)}</span><span class="a-cap" style="left:${W-40}px">止 · ${fmtT(model.stays[model.stays.length-1].endMS)}</span>`;
  const hits=stops.map((s,i)=>`<button class="stop-hit" data-hit="${i}" data-key="${esc(s.stay.key)}" style="left:${s.x}px;top:${s.y}px" aria-label="${esc(s.stay.topic.label)}"></button>`).join('');
  host.innerHTML=`<div class="scroll-wrap"><div class="scroll-scene" id="scene" style="width:${W}px"><svg width="${W}" height="${H}">${threads}${inkPaths}${restBridges.join('')}${dots}</svg>${labels}${rests}${ticks}${caps}${hits}</div></div>`;
  const scene=host.querySelector('#scene');
  host.addEventListener('mouseover',e=>{
    const hit=e.target.closest('[data-hit]');if(!hit)return;
    const key=hit.dataset.key;scene.classList.add('dimmed');
    scene.querySelectorAll('.a-thread').forEach(t=>t.classList.toggle('lit',t.dataset.thread===key));
    stops.forEach((s,i)=>{const on=s.stay.key===key;
      scene.querySelector(`[data-stop="${i}"]`)?.classList.toggle('lit',on);
      scene.querySelector(`[data-stoplab="${i}"]`)?.classList.toggle('lit',on)});
  });
  host.addEventListener('mouseleave',()=>{scene.classList.remove('dimmed');scene.querySelectorAll('.lit').forEach(n=>n.classList.remove('lit'))});
}
/* ───────────────────────── variant B 庭园 ───────────────────────── */
function blobPath(cx,cy,r,seed){
  const rand=rng(seed),n=9,pts=[];
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n,rr=r*(0.88+rand()*.24);pts.push([cx+Math.cos(a)*rr*1.18,cy+Math.sin(a)*rr])}
  pts.push(pts[0],pts[1]);
  return curve(pts)+' Z';
}
function renderGarden(model,host){
  const W=host.clientWidth-2,pad=34;
  const topics=[...model.topics].sort((a,b)=>a.firstMS-b.firstMS);
  topics.forEach(tp=>{
    tp.label=gardenEdits.labels[tp.key]||tp.label;
    tp.r=Math.max(34,Math.min(96,13*Math.sqrt(tp.seconds/60)));
  });
  // flow layout: rows like text
  let x=pad,rowTop=pad,rowMax=0;const placed=[];
  for(const tp of topics){
    const d=tp.r*2.36; // ellipse-ish width
    if(x+d>W-pad&&placed.length){x=pad;rowTop+=rowMax+34;rowMax=0}
    const jr=rng('pos'+tp.key);
    tp.cx=x+d/2+(jr()-.5)*6;tp.cy=rowTop+tp.r+(jr()-.5)*8;
    x+=d+38;rowMax=Math.max(rowMax,tp.r*2+18);placed.push(tp);
  }
  const H=rowTop+rowMax+pad;
  // footpath through stays in order
  const pathPts=model.seq.filter(i=>i.type==='stay').map(i=>{const tp=i.stay.topic,jr=rng('t'+i.stay.startMS);return{x:tp.cx+(jr()-.5)*tp.r*.9,y:tp.cy+(jr()-.5)*tp.r*.7,key:tp.key,rest:false}});
  const restIdx=[];let pi=0;
  model.seq.forEach(i=>{if(i.type==='rest')restIdx.push({after:pi-1,minutes:i.minutes});else pi++});
  const trailSegs=[];
  for(let i=0;i<pathPts.length-1;i++){
    const broken=restIdx.some(r=>r.after===i);
    trailSegs.push(`<path class="b-trail" data-tkeys="${esc(pathPts[i].key)}|${esc(pathPts[i+1].key)}" d="${curve([[pathPts[i].x,pathPts[i].y],[( pathPts[i].x+pathPts[i+1].x)/2,(pathPts[i].y+pathPts[i+1].y)/2-14],[pathPts[i+1].x,pathPts[i+1].y]])}" fill="none" stroke="#8b563e" stroke-width="1" stroke-dasharray="${broken?'1 9':'1 5'}" opacity="${broken?.14:.26}" stroke-linecap="round"/>`);
  }
  const restMarks=restIdx.map(r=>{const a=pathPts[r.after],b=pathPts[r.after+1];if(!a||!b)return'';return`<span class="b-rest" style="left:${(a.x+b.x)/2}px;top:${Math.max(16,(a.y+b.y)/2-34)}px">休 · ${fmtD(r.minutes*60)}</span>`}).join('');
  const blobs=topics.map(tp=>{const c=COLORS[tp.category];
    return`<path d="${blobPath(tp.cx,tp.cy,tp.r,'blob'+tp.key)}" fill="${c}" opacity=".13"/><path d="${blobPath(tp.cx,tp.cy,tp.r,'blob'+tp.key)}" fill="none" stroke="${c}" stroke-width="1.2" opacity=".38"/>`}).join('');
  const startTag=(tp)=>fmtT(tp.firstMS);
  const cards=topics.map((tp,i)=>{
    const fs=tp.r>=78?15:tp.r>=56?13.5:12;
    const visits=tp.visits>1?`<span class="visits">${Array.from({length:Math.min(tp.visits,6)},()=>'<i></i>').join('')}</span>`:'';
    const seal=tp.prior?`<span class="seal ${tp.r>70?'lg':''}">↺${tp.prior}</span>`:'';
    return`<button class="stone" data-stone="${esc(tp.key)}" style="--c:${COLORS[tp.category]};--stone-font:${fs}px;left:${tp.cx}px;top:${tp.cy}px;width:${tp.r*2.3}px;height:${tp.r*2}px">${seal}<span class="stone-core"><b>${esc(tp.label)}</b><span>${fmtD(tp.seconds)} · ${startTag(tp)}${tp.visits>1?` · ${tp.visits}次`:''}</span>${visits}</span></button>`;
  }).join('');
  // detail strip for the selected stone: its visits in order
  let detail='';
  const sel=topics.find(tp=>tp.key===gardenSelected);
  if(sel){
    const visits=model.stays.filter(s=>s.key===sel.key);
    const chips=visits.map((s,i)=>`${i?'<span class="visit-arrow">→</span>':''}<span class="visit-chip" style="--c:${COLORS[sel.category]}">${fmtT(s.startMS)} · ${fmtD(s.seconds)}</span>`).join('');
    const prior=sel.prior?`<span class="seal">↺${sel.prior}</span><span style="color:var(--muted)">前 ${sel.prior} 天也在这里</span>`:'';
    detail=`<div class="garden-detail" style="--c:${COLORS[sel.category]}"><b>${esc(sel.label)}</b><span style="color:var(--muted)">${fmtD(sel.seconds)} · 来了 ${visits.length} 次</span>${chips}${prior}<span class="hint">双击改名 · 拖到别的石头上可合并</span></div>`;
  }
  host.innerHTML=`<div class="garden" id="garden" style="height:${H}px"><svg width="${W}" height="${H}">${blobs}${trailSegs.join('')}</svg>${restMarks}${cards}</div>${detail}<div class="garden-hint">石头可以拿起来 —— 拖到另一块上合并成一个主题,双击直接改名,点一下看回访</div>`;
  const g=host.querySelector('#garden');
  let drag=null; // {key, el, startX, startY, origL, origT, moved, dropKey}
  g.addEventListener('mouseover',e=>{
    if(drag)return;
    const st=e.target.closest('[data-stone]');if(!st)return;
    const key=st.dataset.stone;g.classList.add('dimmed');
    g.querySelectorAll('.stone').forEach(s=>s.classList.toggle('lit',s.dataset.stone===key));
    g.querySelectorAll('.b-trail').forEach(t=>t.classList.toggle('lit',t.dataset.tkeys.split('|').includes(key)));
  });
  g.addEventListener('mouseleave',()=>{if(drag)return;g.classList.remove('dimmed');g.querySelectorAll('.lit').forEach(n=>n.classList.remove('lit'))});
  g.addEventListener('mousedown',e=>{
    const st=e.target.closest('[data-stone]');if(!st||e.target.isContentEditable)return;
    e.preventDefault();
    drag={key:st.dataset.stone,el:st,startX:e.clientX,startY:e.clientY,origL:parseFloat(st.style.left),origT:parseFloat(st.style.top),moved:false,dropKey:null};
  });
  if(window.__gardenMM){document.removeEventListener('mousemove',window.__gardenMM);document.removeEventListener('mouseup',window.__gardenMU)}
  window.__gardenMM=e=>{
    if(!drag)return;
    const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
    if(!drag.moved&&Math.hypot(dx,dy)<6)return;
    drag.moved=true;drag.el.classList.add('dragging');
    drag.el.style.left=`${drag.origL+dx}px`;drag.el.style.top=`${drag.origT+dy}px`;
    const cx=drag.origL+dx,cy=drag.origT+dy;
    drag.dropKey=null;
    for(const tp of topics){
      if(tp.key===drag.key)continue;
      if(Math.hypot(tp.cx-cx,tp.cy-cy)<tp.r+34){drag.dropKey=tp.key;break}
    }
    g.querySelectorAll('.stone').forEach(s=>s.classList.toggle('drop-hint',s.dataset.stone===drag.dropKey));
  };
  window.__gardenMU=()=>{
    if(!drag)return;
    const{key,el,moved,dropKey}=drag;drag=null;
    el.classList.remove('dragging');
    g.querySelectorAll('.drop-hint').forEach(s=>s.classList.remove('drop-hint'));
    if(moved&&dropKey){mergeTopics(key,dropKey,topics);return}
    if(moved){render();return} // snap back
    gardenSelected=gardenSelected===key?null:key;render();
  };
  document.addEventListener('mousemove',window.__gardenMM);
  document.addEventListener('mouseup',window.__gardenMU);
  g.addEventListener('dblclick',e=>{
    const st=e.target.closest('[data-stone]');if(!st)return;
    const key=st.dataset.stone,tp=topics.find(t=>t.key===key);if(!tp)return;
    const b=st.querySelector('b');b.contentEditable='true';b.focus();
    const range=document.createRange();range.selectNodeContents(b);
    const selObj=getSelection();selObj.removeAllRanges();selObj.addRange(range);
    const commit=()=>{const v=b.textContent.trim();if(v&&v!==tp.label){gardenEdits.labels[key]=v;showToast(`已改名为「${v}」`,()=>{delete gardenEdits.labels[key];render()})}render()};
    b.addEventListener('blur',commit,{once:true});
    b.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();b.blur()}if(ev.key==='Escape'){b.textContent=tp.label;b.blur()}});
  });
}
function mergeTopics(srcKey,dstKey,topics){
  const src=topics.find(t=>t.key===srcKey),dst=topics.find(t=>t.key===dstKey);
  gardenEdits.merges[srcKey]=dstKey;
  if(gardenSelected===srcKey)gardenSelected=dstKey;
  showToast(`已把「${src?.label||srcKey}」并入「${dst?.label||dstKey}」`,()=>{delete gardenEdits.merges[srcKey];render()});
  render();
}
function showToast(msg,onUndo){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}
  t.innerHTML=`<span>${esc(msg)}</span><button type="button">撤销</button>`;
  t.querySelector('button').onclick=()=>{t.classList.remove('show');onUndo&&onUndo()};
  t.classList.add('show');
  clearTimeout(t.__timer);t.__timer=setTimeout(()=>t.classList.remove('show'),5000);
}
/* ───────────────────────── variant C 册页 ───────────────────────── */
function renderLeaf(model,host,headline){
  const maxSec=Math.max(...model.stays.map(s=>s.seconds));
  // group: short stays (<10min) between long ones become 碎片 rows
  const rows=[];let frag=[];
  const flush=()=>{if(frag.length){rows.push({type:'frag',items:frag});frag=[]}};
  for(const it of model.seq){
    if(it.type==='rest'){flush();rows.push(it);continue}
    if(it.stay.seconds<10*60)frag.push(it.stay);
    else{flush();rows.push(it)}
  }
  flush();
  const monthDay=new Date(model.stays[0].startMS);
  const cn=['日','一','二','三','四','五','六','七','八','九','十','十一','十二'];
  const html=rows.map((row,ri)=>{
    if(row.type==='rest')return`<div class="rest-row">休息了 ${fmtD(row.minutes*60)}</div>`;
    if(row.type==='frag'){
      const bits=row.items.map(s=>`<span class="dot" style="--c:${COLORS[s.category]}"></span>${esc(s.visit>1?'又回了 '+s.topic.identity:s.title)} <i>${fmtD(s.seconds)}</i>`).join('、');
      return`<div class="chapter"><time>${fmtT(row.items[0].startMS)}</time><div class="chapter-body" style="--c:var(--line)"><p class="frag" style="margin:0">碎片时刻 —— ${bits}</p></div></div>`;
    }
    const s=row.stay,c=COLORS[s.category];
    const longest=s.seconds===maxSec?' ,今天最长的一段':'';
    const again=s.visit>1?`<span class="again">第 ${s.visit} 次回来</span>`:'';
    const seal=(s.visit===1&&s.topic.prior)?`<span class="seal">↺${s.topic.prior}</span><span style="font-size:9.5px">前 ${s.topic.prior} 天也在</span>`:'';
    const barW=Math.max(28,Math.round(s.seconds/maxSec*150));
    return`<div class="chapter"><time>${fmtT(s.startMS)}</time><div class="chapter-body" style="--c:${c}">
      <h5>${esc(s.visit>1?s.topic.label:s.title)}<svg viewBox="0 0 100 5" preserveAspectRatio="none"><path d="${wobble(0,100,2.5,'u'+s.startMS)}"/></svg></h5>
      <div class="meta"><span style="color:${c};font-weight:650">${CAT_LABEL[s.category]}</span><span>${esc(s.topic.identity)}</span><span>${fmtD(s.seconds)}${longest}</span>${again}${seal}<span class="ink-bar" style="width:${barW}px"></span></div>
    </div></div>`;
  }).join('');
  host.innerHTML=`<div class="leaf">
    <div class="leaf-head"><span class="seal lg date-seal">米墨</span><h4>${esc(headline)}</h4><p>${cn[monthDay.getMonth()+1]}月${monthDay.getDate()<11?cn[monthDay.getDate()]:monthDay.getDate()}日 · ${fmtT(model.stays[0].startMS)} 起 · ${fmtT(model.stays[model.stays.length-1].endMS)} 止</p></div>
    ${html}
    <div class="leaf-foot">共 ${model.stays.length} 段停留 · ${model.topics.length} 个主题 · 活跃 ${fmtD(model.total)}</div>
  </div>`;
}
/* ───────────────────────── shell ───────────────────────── */
const VARIANTS=[
  {key:'A',name:'甲 · 手卷',note:'一条墨线走完一天 · 空闲已折叠 · 悬停看主题回访',render:renderScroll},
  {key:'B',name:'乙 · 庭园',note:'主题是石,面积是时长 · 点选看回访 · 拖动合并 · 双击改名',render:renderGarden},
  {key:'C',name:'丙 · 册页',note:'不画图,一天写成一页手记',render:renderLeaf}];
const DATA={dense:makeDense(),sparse:makeSparse()};
/* in-memory 庭园 corrections — mirrors JourneyGraphCorrections (labels/merges) */
const gardenEdits={merges:{},labels:{}};
let gardenSelected=null;
function resolveMergeKey(key){
  const seen=new Set();let k=key;
  while(gardenEdits.merges[k]&&!seen.has(k)){seen.add(k);k=gardenEdits.merges[k]}
  return k;
}
function applyGardenEdits(data){
  if(!Object.keys(gardenEdits.merges).length)return data;
  const prior={...data.prior};
  const blocks=data.blocks.map(b=>{
    const key=b.category+'|'+b.identity,rk=resolveMergeKey(key);
    if(rk===key)return b;
    if(data.prior[key])prior[rk]=Math.max(prior[rk]||0,data.prior[key]);
    const sep=rk.indexOf('|');
    return{...b,category:rk.slice(0,sep),identity:rk.slice(sep+1)};
  });
  return{...data,blocks,prior};
}
const initial=new URLSearchParams(location.search);
let current={v:(initial.get('variant')||'A').toUpperCase(),d:initial.get('data')||'dense'};
function params(){return current}
function setParams(v,d){
  current={v,d};
  try{const p=new URLSearchParams(location.search);p.set('variant',v);p.set('data',d);history.replaceState(null,'',`?${p}`)}catch(_){/* file:// may forbid */}
  render();
}
function render(){
  const{v,d}=params();
  const variant=VARIANTS.find(x=>x.key===v)||VARIANTS[0];
  const data=DATA[d]||DATA.dense;
  const model=buildModel(variant.key==='B'?applyGardenEdits(data):data);
  document.getElementById('heroTitle').textContent=data.headline;
  document.getElementById('heroMetrics').innerHTML=[
    ['活跃',fmtD(model.total)],['停留',model.stays.length+' 段'],['主题',model.topics.length+' 个']
  ].map(([k,val])=>`<span>${k}<strong>${val}</strong></span>`).join('');
  document.getElementById('stageNote').textContent=variant.note;
  document.getElementById('variantLabel').textContent=variant.name;
  document.querySelectorAll('.data-btn').forEach(b=>b.classList.toggle('on',b.dataset.data===(DATA[d]?d:'dense')));
  const body=document.getElementById('stageBody');body.innerHTML='';
  variant.render(model,body,data.headline);
  // ribbon context: 30-min slots
  const start=Math.floor(model.stays[0].startMS/1800000)*1800000,end=model.stays[model.stays.length-1].endMS;
  const slots=[];for(let t=start;t<end;t+=1800000){const hit=model.stays.find(s=>s.startMS<t+1800000&&s.endMS>t);slots.push(hit?`<i class="on" style="--c:${COLORS[hit.category]}"></i>`:'<i></i>')}
  document.getElementById('ribbon').innerHTML=slots.join('');
}
function cycle(dir){
  const{v,d}=params();
  const i=VARIANTS.findIndex(x=>x.key===v);
  setParams(VARIANTS[(i+dir+VARIANTS.length)%VARIANTS.length].key,d);
}
document.getElementById('prevBtn').onclick=()=>cycle(-1);
document.getElementById('nextBtn').onclick=()=>cycle(1);
document.querySelectorAll('.data-btn').forEach(b=>b.onclick=()=>setParams(params().v,b.dataset.data));
addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;
  if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);
});
addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(render,150)});
render();
</script>
