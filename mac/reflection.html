<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mimo · Today Journal</title>
<style>
:root{
  color-scheme:light;
  --paper:#f5f1e9;--paper-2:#fffdf8;--ink:#302d29;--muted:#7d766d;
  --line:#ddd5c8;--line-soft:#eee7dc;--accent:#8b563e;--accent-soft:#f2e8df;
  --building:#a9583d;--learning:#577d70;--communication:#99743e;
  --planning:#716c9b;--admin:#8a8176;--entertainment:#a36773;
  --shadow:0 1px 0 rgba(55,47,38,.025);--radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
body{font-size:14px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ui-icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 28px;background:rgba(245,241,233,.94);border-bottom:1px solid rgba(221,214,202,.72);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.brand-mark{width:32px;height:32px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font:600 15px Georgia,serif}
.brand h1{font:600 18px/1 Georgia,"Songti SC",serif;margin:0}
.range-controls{display:flex;align-items:center;gap:9px}
.segmented{display:flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:rgba(255,254,250,.7)}
.segmented button{border:0;background:transparent;padding:6px 11px;border-radius:8px;color:var(--muted);font-size:12px}
.segmented button.active{background:var(--ink);color:#fff;box-shadow:0 3px 12px rgba(48,45,41,.15)}
.date-input{display:none;border:1px solid var(--line);background:var(--paper-2);border-radius:10px;padding:7px 9px;max-width:142px}
.date-input.visible{display:block}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
main{max-width:1440px;margin:0 auto;padding:24px 28px 56px}
.notice{display:none;margin-bottom:16px;padding:11px 14px;border:1px solid var(--line);background:var(--paper-2);border-radius:12px;color:var(--muted)}
.notice.visible{display:flex;align-items:center;justify-content:space-between;gap:12px}
.notice.error{border-color:#d5a3a0;color:#8a3e3b;background:#fff7f4}
.hero{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(340px,.62fr);gap:18px;margin-bottom:18px}
.card{background:var(--paper-2);border:1px solid rgba(221,213,200,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
.overview{padding:26px 28px;overflow:hidden;position:relative}
.overview:after{content:"";position:absolute;right:-78px;top:-108px;width:250px;height:250px;border-radius:50%;border:48px solid rgba(139,86,62,.032);pointer-events:none}
.date-label{color:var(--accent);font-weight:600;letter-spacing:.015em;font-size:11px}
.overview h2{font:600 clamp(28px,3.4vw,46px)/1.08 Georgia,"Songti SC",serif;max-width:760px;margin:10px 0 0;letter-spacing:-.025em}
.metrics{display:grid;grid-template-columns:1.15fr repeat(3,minmax(0,1fr));gap:12px;margin-top:31px}
.metric{border-top:1px solid var(--line);padding-top:12px;min-width:0;transition:border-color .2s ease}
.metric:hover{border-color:var(--ink)}
.metric-primary{border-top:2px solid var(--accent);padding-top:11px}
.metric strong{display:block;font:600 25px/1 Georgia,"Songti SC",serif;white-space:nowrap;margin-top:8px}
.metric-primary strong{font-size:30px;color:var(--accent)}
.metric-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;letter-spacing:0;white-space:nowrap}
.metric-label .ui-icon{width:14px;height:14px}
.distribution{padding:23px;display:grid;grid-template-columns:134px 1fr;gap:21px;align-items:center}
.donut{width:134px;height:134px;border-radius:50%;position:relative;background:var(--line-soft);box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.donut{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.distribution:hover .donut{transform:scale(1.025);box-shadow:inset 0 0 0 1px rgba(0,0,0,.03),0 10px 24px rgba(74,58,39,.08)}
.donut:after{content:"";position:absolute;inset:23px;background:var(--paper-2);border-radius:50%;box-shadow:0 0 0 1px var(--line-soft)}
.donut-center{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;justify-items:center}
.donut-center .ui-icon{width:15px;height:15px;color:var(--muted);margin-bottom:4px}.donut-center strong{font:600 22px/1 Georgia,serif}.donut-center span{font-size:9px;color:var(--muted);margin-top:4px}
.section-label{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font:600 15px/1.2 Georgia,"Songti SC",serif;letter-spacing:0}
.section-label .ui-icon{width:15px;height:15px;color:var(--accent)}
.legend{display:grid;gap:8px;margin-top:13px}
.legend-row{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.legend-icon{width:21px;height:21px;border-radius:7px;background:color-mix(in srgb,var(--category),white 90%);color:var(--category);display:grid;place-items:center}
.legend-icon .ui-icon{width:12px;height:12px}
.legend-row{grid-template-columns:21px minmax(0,1fr) auto}
.legend-row strong{font-weight:650;color:var(--ink)}
.journey-map{position:relative;z-index:6;margin-bottom:18px;padding:19px 22px 18px;overflow:hidden}
.journey-map-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}
.journey-count{font-size:10px;color:var(--muted);letter-spacing:0;font-weight:500;white-space:nowrap}
.journey-ribbon{display:flex;align-items:stretch;gap:8px;min-height:112px;position:relative;padding:2px 0 6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}.journey-ribbon::-webkit-scrollbar{display:none}
.half-hour-chapter{--category:var(--admin);position:relative;flex:0 0 154px;min-width:154px;min-height:106px;padding:10px;border:1px solid color-mix(in srgb,var(--category),white 74%);border-radius:16px;background:color-mix(in srgb,var(--category),#fffdf8 95%);color:var(--ink);font:inherit;text-align:left;display:grid;grid-template-rows:auto auto 18px auto;gap:7px;overflow:hidden;scroll-snap-align:start;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s,opacity .2s}
.half-hour-chapter.muted{opacity:.28;filter:saturate(.35)}
.half-hour-chapter.quiet{--category:var(--line);background:linear-gradient(135deg,#fffdf8,#faf6ee);border-style:dashed;color:var(--muted)}
.half-hour-chapter:hover,.half-hour-chapter:focus-visible,.half-hour-chapter.selected{z-index:2;transform:translateY(-2px);border-color:color-mix(in srgb,var(--category),white 38%);box-shadow:0 8px 18px rgba(63,50,36,.075);outline:none}
.half-hour-chapter.selected{box-shadow:0 0 0 1px color-mix(in srgb,var(--category),white 25%),0 8px 18px rgba(63,50,36,.075)}
.chapter-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.chapter-clock{color:var(--accent);font:650 11px ui-monospace,SFMono-Regular,Menlo,monospace}.chapter-used{color:var(--category);font:600 10px Georgia,serif;white-space:nowrap}
.chapter-main{display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:7px;min-width:0}.chapter-identity{width:26px;height:26px;padding:3px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.76);box-shadow:0 0 0 1px rgba(60,50,40,.05)}.chapter-identity .ui-icon{width:13px;height:13px;color:var(--category)}
.chapter-label{display:block;min-width:0;font:600 13px/1.15 Georgia,"Songti SC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapter-track{position:relative;height:18px;border:1px solid rgba(90,73,54,.08);border-radius:6px;background:repeating-linear-gradient(90deg,rgba(90,73,54,.045) 0,rgba(90,73,54,.045) 1px,transparent 1px,transparent 25%);overflow:hidden}.chapter-segment{--segment:var(--admin);position:absolute;top:2px;bottom:2px;min-width:2px;border-radius:4px;background:var(--segment);opacity:.78;transition:opacity .18s,transform .18s}.chapter-segment.filtered{opacity:.1}.half-hour-chapter:hover .chapter-segment,.half-hour-chapter.selected .chapter-segment{opacity:.96;transform:scaleY(1.08)}
.chapter-foot{display:flex;align-items:center;justify-content:space-between;gap:7px;color:var(--muted);font-size:9px;white-space:nowrap}.chapter-foot span:last-child{overflow:hidden;text-overflow:ellipsis}
.journey-preview{display:grid;grid-template-columns:136px minmax(0,1fr) minmax(210px,auto) auto;align-items:center;gap:14px;min-height:60px;margin-top:7px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:linear-gradient(110deg,rgba(139,86,62,.045),rgba(87,125,112,.025));overflow:hidden}
.journey-preview.updated{animation:preview-in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes preview-in{0%{transform:translateY(3px);background-color:rgba(139,86,62,.08)}100%{transform:none;background-color:transparent}}
.journey-preview-kicker{color:var(--accent);font-size:10px;letter-spacing:0;font-weight:650}
.journey-preview-title{font:600 16px/1.25 Georgia,"Songti SC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.journey-preview-meta{color:var(--muted);font-size:10px;text-align:right;white-space:nowrap}
.journey-ask{border:1px solid var(--line);border-radius:9px;background:var(--paper-2);padding:6px 9px;color:var(--accent);font-size:10px;white-space:nowrap}.journey-ask:hover{border-color:var(--accent);background:var(--accent-soft)}.journey-ask:disabled{opacity:.4;cursor:default}
.workspace{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(340px,.72fr);gap:18px;align-items:start}
.trail-panel,.reflection-panel{padding:20px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:17px}
.trail-panel .section-head{display:block}
.category-filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft)}
.filter-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 8px;border-radius:99px;font-size:10px}
.filter-chip .ui-icon{width:12px;height:12px}
.filter-chip.active{border-color:var(--ink);background:var(--ink);color:#fff}
.timeline{position:relative;padding-left:24px}
.timeline:before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,var(--building),var(--learning) 38%,var(--planning) 68%,var(--entertainment));opacity:.28;border-radius:99px}
.journey-phase{position:relative;display:flex;align-items:center;gap:9px;margin:19px 0 10px;color:var(--muted);font-size:11px;letter-spacing:0;font-weight:650}
.journey-phase:first-child{margin-top:3px}
.journey-phase>span{display:flex;align-items:center;gap:5px}.journey-phase .ui-icon{width:12px;height:12px}
.journey-phase:before{content:"";position:absolute;left:-22px;width:10px;height:10px;border-radius:50%;background:var(--paper-2);border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.journey-phase:after{content:"";height:1px;background:var(--line-soft);flex:1}
.activity-card{--category:var(--admin);--main-height:78px;position:relative;margin:0 0 11px;border:1px solid var(--line-soft);border-radius:16px;background:#fffdfa;transition:.18s ease}
.activity-card:before{content:"";position:absolute;left:-24px;top:23px;width:10px;height:10px;border-radius:50%;background:var(--category);box-shadow:0 0 0 4px var(--paper-2);transition:transform .2s,box-shadow .2s}
.activity-card:hover,.activity-card:focus-within{transform:translateX(3px);border-color:color-mix(in srgb,var(--category),white 62%);box-shadow:0 7px 18px rgba(70,55,39,.07)}
.activity-card:hover:before,.activity-card:focus-within:before{transform:scale(1.25);box-shadow:0 0 0 5px color-mix(in srgb,var(--category),white 84%),0 0 18px color-mix(in srgb,var(--category),transparent 55%)}
.activity-card.located{outline:2px solid color-mix(in srgb,var(--category),white 25%);outline-offset:2px}
.activity-card:focus-visible{outline:2px solid color-mix(in srgb,var(--category),white 30%);outline-offset:2px}
.activity-main{display:grid;grid-template-columns:62px 32px minmax(0,1fr) auto;gap:11px;align-items:center;min-height:var(--main-height);padding:12px 14px;transition:opacity .16s}
.activity-card:hover .activity-meta,.activity-card:focus-visible .activity-meta{opacity:0}
.activity-time{font:600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}
.activity-title{font-weight:720;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:5px}
.activity-meta>span{display:inline-flex;align-items:center;gap:3px}.activity-meta .ui-icon{width:11px;height:11px}
.activity-icon{width:32px;height:32px;padding:4px;border-radius:10px;display:grid;place-items:center;color:var(--category);background:color-mix(in srgb,var(--category),white 91%)}
.activity-icon .ui-icon{width:15px;height:15px}.category-name{color:var(--category);font-weight:700}.meta-dot{opacity:.45}
.identity-mark{width:100%;height:100%;display:grid;place-items:center;min-width:0;min-height:0}.identity-mark>*{grid-area:1/1}.identity-image{display:block;width:100%;height:100%;object-fit:contain;border-radius:6px}.identity-fallback{display:none;place-items:center;width:100%;height:100%}.identity-mark.failed .identity-image{display:none}.identity-mark.failed .identity-fallback{display:grid}
.duration{font:600 15px Georgia,serif;color:var(--accent);white-space:nowrap}
.raw-toggle{border:0;background:transparent;color:var(--muted);font-size:10px;padding:6px 14px 9px;text-align:left;width:100%;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:4px}
.raw-toggle .ui-icon{width:13px;height:13px;transition:transform .18s}.activity-card.open .raw-toggle .ui-icon{transform:rotate(180deg)}
.raw-events{display:none;border-top:1px solid var(--line-soft);padding:5px 16px 12px}
.activity-card.open .raw-events{display:block}.activity-card.open .raw-toggle{color:var(--accent)}
.activity-hover{position:absolute;z-index:2;left:119px;right:84px;bottom:16px;height:18px;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;opacity:0;overflow:hidden;transform:translateY(3px);pointer-events:none;transition:opacity .16s,transform .2s cubic-bezier(.2,.8,.2,1)}
.activity-card:hover .activity-hover,.activity-main:hover + .activity-hover,.activity-card:focus-visible .activity-hover{opacity:1;transform:none}
.activity-hover .hover-context{color:var(--category);font-weight:650;white-space:nowrap}.hover-tools{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hover-foot,.hover-stats{display:none}
.timeline.dense .activity-card{--main-height:70px;margin-bottom:8px;border-radius:13px}.timeline.dense .activity-main{padding:9px 14px}.timeline.dense .raw-toggle{padding:6px 14px 9px}
.raw-event{display:grid;grid-template-columns:60px 105px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:11px;color:var(--muted);align-items:center}
.raw-event:last-child{border-bottom:0}.raw-event strong{color:var(--ink);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raw-link{border:0;background:transparent;color:var(--accent);padding:2px 0;font-size:11px}
.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty strong{display:block;color:var(--ink);font:600 20px Georgia,serif;margin-bottom:7px}
.empty>.ui-icon{width:22px;height:22px;color:var(--accent);margin-bottom:9px}.empty>span{font-size:11px}
.reflection-panel{position:sticky;top:91px;max-height:calc(100vh - 112px);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin}
.reflection-badge{display:flex;align-items:center;gap:4px;font-size:9px;letter-spacing:0;padding:4px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:650;white-space:nowrap}
.reflection-badge .ui-icon{width:10px;height:10px}
.reflection-summary{color:var(--muted);margin:0 0 14px;font-size:11px;line-height:1.55}
.reflection-section{border-top:1px solid var(--line-soft);padding:15px 0 3px}
.reflection-section h4{display:flex;justify-content:space-between;align-items:center;margin:0 0 9px;font-size:11px;letter-spacing:0;color:var(--accent)}
.reflection-section-title{display:flex;align-items:center;gap:6px}.reflection-section-title .ui-icon{width:13px;height:13px}
.reflection-section ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.reflection-section li{font-size:12px;line-height:1.5;padding-left:14px;position:relative}
.reflection-section li:before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--line)}
.evidence-btn{display:inline-flex;align-items:center;gap:3px;border:0;background:var(--paper);color:var(--muted);font-size:9px;padding:2px 5px;margin-left:4px;border-radius:99px;white-space:nowrap}.evidence-btn .ui-icon{width:10px;height:10px}
.ai-box{margin-top:17px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;background:#faf6ef}
.ai-box p{margin:0 0 9px;color:var(--muted);font-size:10px}
.prompt-suggestions{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 8px}.prompt-suggestion{border:1px solid var(--line-soft);border-radius:999px;background:transparent;padding:4px 7px;color:var(--muted);font-size:9.5px}.prompt-suggestion:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.prompt-row{display:flex;gap:7px}
.prompt-row input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);padding:8px 9px;font-size:11px;outline:none}
.prompt-row input:focus{border-color:var(--accent)}
.primary-btn{border:0;border-radius:9px;background:var(--accent);color:#fff;padding:8px 10px;font-size:10px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}.primary-btn .ui-icon{width:13px;height:13px}
.primary-btn:disabled{opacity:.42;cursor:not-allowed}
.materials{margin-top:18px;padding:22px}
.materials-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.material-card{--material-accent:var(--learning);position:relative;overflow:hidden;border:1px solid var(--line-soft);border-radius:17px;background:#fffdfa;padding:17px;min-width:0;display:flex;flex-direction:column;min-height:220px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.material-card:hover,.material-card:focus-within{transform:translateY(-3px);border-color:color-mix(in srgb,var(--material-accent),white 64%);box-shadow:0 10px 24px rgba(64,51,37,.09)}
.material-card:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-58px;bottom:-63px;border:22px solid color-mix(in srgb,var(--material-accent),white 91%);transition:transform .35s}
.material-card:hover:before{transform:scale(1.35)}
.material-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.material-kind{display:inline-flex;align-items:center;gap:6px;color:var(--learning);background:color-mix(in srgb,var(--learning),white 91%);border-radius:99px;padding:4px 7px 4px 5px;letter-spacing:0;font-size:9px;font-weight:650}.material-kind>.identity-mark{width:17px;height:17px}.material-kind .ui-icon{width:11px;height:11px}
.material-time{font:600 12px Georgia,serif;color:var(--accent)}
.material-card h4{font:600 17px/1.25 Georgia,"Songti SC",serif;margin:13px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.material-source{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.material-overview{font-size:12px;color:var(--muted);margin:13px 0 9px;line-height:1.5}
.material-ideas{margin:0 0 10px;padding-left:16px;font-size:11px;display:grid;gap:5px}
.material-relevance{font-size:11px;padding:8px 9px;border-left:2px solid var(--learning);background:color-mix(in srgb,var(--learning),white 94%);margin-top:auto}
.material-open{align-self:flex-start;border:0;background:transparent;color:var(--accent);padding:10px 0 0;font-size:10px;display:flex;align-items:center;gap:4px}.material-open .ui-icon{width:12px;height:12px}
.material-peek-hint{margin-top:auto;padding-top:12px;color:var(--material-accent);font-size:9px;font-weight:650;letter-spacing:0;display:flex;align-items:center;gap:5px}.material-peek-hint .ui-icon{width:12px;height:12px}
.material-insight-overlay{position:absolute;z-index:4;inset:8px;padding:15px;border:1px solid color-mix(in srgb,var(--material-accent),white 62%);border-radius:13px;background:rgba(255,253,248,.985);box-shadow:0 18px 45px rgba(52,42,30,.16);opacity:0;transform:translateY(15px) scale(.98);pointer-events:none;transition:opacity .18s,transform .24s cubic-bezier(.2,.8,.2,1);overflow:auto}
.material-card:hover .material-insight-overlay,.material-card:focus-within .material-insight-overlay{opacity:1;transform:none;pointer-events:auto}
.material-insight-overlay .overlay-label{font-size:9px;letter-spacing:0;color:var(--material-accent);font-weight:650}
.material-insight-overlay h5{font:600 17px/1.25 Georgia,"Songti SC",serif;margin:6px 0 8px}
.material-insight-overlay p{font-size:11px;color:var(--muted);margin:0 0 9px;line-height:1.5}
.privacy-note{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-size:9px;letter-spacing:.04em}.privacy-note .ui-icon{width:11px;height:11px}
.modal-backdrop{display:none;position:fixed;inset:0;z-index:60;background:rgba(37,32,27,.32);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
.modal-backdrop.open{display:flex}
.modal{width:min(540px,100%);background:var(--paper-2);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 80px rgba(40,31,22,.25);padding:23px}
.modal h3{font:600 22px Georgia,serif;margin:0}.modal p{color:var(--muted);font-size:12px;margin:7px 0 18px}
.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}.field textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:var(--paper);padding:10px;outline:none}.field textarea:focus{border-color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}.secondary-btn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:8px 12px}
.loading .activity-card{opacity:.62}
@media(max-width:1080px){.hero,.workspace{grid-template-columns:1fr}.distribution{grid-template-columns:134px 1fr}.reflection-panel{position:relative;top:auto;max-height:none}.materials-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.topbar{padding:12px 16px;align-items:flex-start}.brand{min-width:0}.range-controls{flex-wrap:wrap;justify-content:flex-end}main{padding:18px 14px 44px}.metrics{grid-template-columns:repeat(2,1fr)}.journey-ribbon{margin-right:-14px;padding-right:14px}.half-hour-chapter{min-width:150px}.journey-preview{grid-template-columns:1fr;gap:4px}.journey-preview-meta{text-align:left;white-space:normal}.journey-ask{justify-self:start}.category-filters{flex-wrap:nowrap;overflow-x:auto}.materials-grid{grid-template-columns:1fr}.activity-main{grid-template-columns:54px 30px minmax(0,1fr)}.activity-main .duration{grid-column:3}.activity-hover{display:none}.raw-event{grid-template-columns:50px 80px minmax(0,1fr)}.raw-link{display:none}}
@media(hover:none){.material-insight-overlay{position:relative;inset:auto;opacity:1;transform:none;pointer-events:auto;box-shadow:none;margin-top:12px}.material-card{min-height:0}}
</style>

<body>

  <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8"/><path d="M18 13v6H5V6h6"/></symbol>
</svg>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">M</div><h1 id="brandTitle">今日手记</h1></div>
    <div class="range-controls">
      <div class="segmented" id="rangeTabs">
        <button data-range="today" class="active">今天</button>
        <button data-range="week">7 天</button>
        <button data-range="custom">自定义</button>
      </div>
      <input class="date-input" id="startDate" type="date" aria-label="开始日期">
      <input class="date-input" id="endDate" type="date" aria-label="结束日期">
      <button class="icon-btn" id="privacyBtn" aria-label="隐私设置"><svg class="ui-icon"><use href="#icon-sliders"/></svg></button>
    </div>
  </header>
  <main>
    <div class="notice" id="notice"><span id="noticeText"></span></div>
    <section class="hero">
      <div class="card overview">
        <div class="date-label" id="dateLabel">只在这台 Mac · 今天</div>
        <h2 id="headline">今天，慢慢留下了一些痕迹。</h2>
        <div class="metrics">
          <div class="metric metric-primary"><div class="metric-label"><svg class="ui-icon"><use href="#icon-focus"/></svg><span id="focusLabel">专注</span></div><strong id="focusMetric">—</strong></div>
          <div class="metric"><div class="metric-label"><svg class="ui-icon"><use href="#icon-time"/></svg><span id="activeLabel">活动</span></div><strong id="activeMetric">—</strong></div>
          <div class="metric"><div class="metric-label"><svg class="ui-icon"><use href="#icon-grid"/></svg><span id="blockLabel">片段</span></div><strong id="blockMetric">—</strong></div>
          <div class="metric"><div class="metric-label"><svg class="ui-icon"><use href="#icon-switch"/></svg><span id="switchLabel">切换</span></div><strong id="switchMetric">—</strong></div>
        </div>
      </div>
      <div class="card distribution">
        <div class="donut" id="donut"><div class="donut-center"><svg class="ui-icon"><use href="#icon-book"/></svg><strong id="materialMetric">0</strong><span id="materialLabel">材料</span></div></div>
        <div><h3 class="section-label"><svg class="ui-icon"><use href="#icon-time"/></svg><span id="distributionTitle">时间</span></h3><div class="legend" id="legend"></div></div>
      </div>
    </section>

    <section class="card journey-map" aria-labelledby="journeyMapTitle">
      <div class="journey-map-head">
        <h3 class="section-label" id="journeyMapTitle"><svg class="ui-icon"><use href="#icon-flow"/></svg><span>一天的节奏</span></h3>
        <span class="journey-count" id="journeyClusterCount"></span>
      </div>
      <div class="journey-ribbon" id="journeyRibbon"></div>
      <div class="journey-preview" id="journeyPreview" aria-live="polite">
        <span class="journey-preview-kicker" id="journeyPreviewKicker">今天的一章</span>
        <strong class="journey-preview-title" id="journeyPreviewTitle">今天还在展开</strong>
        <span class="journey-preview-meta" id="journeyPreviewMeta">悬停任意一段，回看当时的上下文</span>
        <button class="journey-ask" id="journeyAsk" type="button">回看这半小时</button>
      </div>
    </section>

    <div class="workspace">
      <section class="card trail-panel" aria-labelledby="trailTitle">
        <div class="section-head"><h3 class="section-label" id="trailTitle"><svg class="ui-icon"><use href="#icon-flow"/></svg><span>今天走过</span></h3><div class="category-filters" id="categoryFilters"></div></div>
        <div class="timeline" id="timeline"></div>
      </section>

      <aside class="card reflection-panel" aria-labelledby="reflectionTitle">
        <div class="section-head"><h3 class="section-label" id="reflectionTitle"><svg class="ui-icon"><use href="#icon-reflect"/></svg><span>回看</span></h3><span class="reflection-badge" id="reflectionBadge"><svg class="ui-icon"><use href="#icon-lock"/></svg> 只在本机</span></div>

            <button class="prompt-suggestion" type="button" data-prompt="carry">明天接什么？</button>

          <div class="prompt-row"><input id="prompt" maxlength="2000" placeholder="关于今天，想问什么？"><button class="primary-btn" id="synthesizeBtn"><svg class="ui-icon"><use href="#icon-wand"/></svg><span>一起看看</span></button></div>

    <div class="privacy-note" id="privacyNote"><svg class="ui-icon"><use href="#icon-lock"/></svg><span>仅存于这台 Mac</span></div>
  </main>
</div>

<div class="modal-backdrop" id="privacyModal" role="dialog" aria-modal="true" aria-labelledby="privacyTitle">
  <div class="modal"><h3 id="privacyTitle">隐藏不想回看的内容</h3><p id="privacyDescription">每行一个 App 或 domain。过滤只影响今日手记，不删除原始日志。</p>
    <div class="field"><label id="appsLabel" for="ignoredApps">忽略的 App</label><textarea id="ignoredApps" placeholder="WeChat\nPasswords"></textarea></div>
    <div class="field"><label id="domainsLabel" for="ignoredDomains">忽略的 Domain</label><textarea id="ignoredDomains" placeholder="example.com"></textarea></div>
    <div class="modal-actions"><button class="secondary-btn" id="cancelPrivacy">取消</button><button class="primary-btn" id="savePrivacy">保存并刷新</button></div>
  </div>
</div>

<script>
const bridge=window.webkit?.messageHandlers?.reflection;
const post=payload=>{if(bridge)bridge.postMessage(payload)};
const categoryOrder=['building','learning','communication','planning','admin','entertainment'];
const colors={building:'#a9583d',learning:'#577d70',communication:'#99743e',planning:'#716c9b',admin:'#8a8176',entertainment:'#a36773'};
const labels={
  zh:{building:'创作',learning:'学习',communication:'沟通',planning:'规划',admin:'事务',entertainment:'娱乐'},
  en:{building:'Building',learning:'Learning',communication:'Communication',planning:'Planning',admin:'Admin',entertainment:'Entertainment'}
};
let state={config:{language:'zh-CN',modelConfigured:false,ignoredApps:[],ignoredDomains:[]},range:{mode:'today',start:'',end:''},metrics:{},categories:[],appIcons:{},activityBlocks:[],learningMaterials:[],reflection:{sections:[]},status:{}};
let language='zh';
let activeCategory='all';
const halfHourChapters=[];
let selectedHalfHourID='';
let focusedLookingBackID='';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uiIcon=name=>`<svg class="ui-icon" aria-hidden="true"><use href="#icon-${esc(name)}"></use></svg>`;
const tx=(zh,en)=>language==='zh'?zh:en;
const categoryLabel=id=>(labels[language]||labels.en)[id]||id;
const categoryIcon=id=>({building:'spark',learning:'book',communication:'chat',planning:'plan',admin:'check',entertainment:'play'}[id]||'grid');
const materialIcon=kind=>({paper:'book',website:'external',video:'play',document:'book'}[String(kind||'').toLowerCase()]||'book');
const materialKindLabel=kind=>({paper:tx('论文','Paper'),website:tx('网页','Website'),video:tx('视频','Video'),document:tx('文档','Document')}[String(kind||'').toLowerCase()]||kind);
const reflectionIcon=id=>({"What I Did":'spark',"Time & Attention":'focus',"What I Learned":'book',"Open Loops":'reflect',"Carry Forward":'flow'}[id]||'reflect');
const phaseInfo=value=>{
  const hour=new Date(value).getHours();
  if(hour<5)return{id:'night',label:tx('深夜','Late night')};
  if(hour<12)return{id:'morning',label:tx('上午','Morning')};
  if(hour<18)return{id:'afternoon',label:tx('下午','Afternoon')};
  return{id:'evening',label:tx('晚上','Evening')};
};
const fmtDuration=seconds=>{
  const total=Math.max(0,Math.round(Number(seconds)||0));
  if(total<60)return `${total}s`;
  const h=Math.floor(total/3600),m=Math.round((total%3600)/60);
  if(h&&m)return language==='zh'?`${h}小时 ${m}分`:`${h}h ${m}m`;
  if(h)return language==='zh'?`${h}小时`:`${h}h`;
  return language==='zh'?`${m}分钟`:`${m}m`;
};
const fmtTime=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleTimeString(language==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit',hour12:false})};
const unique=values=>[...new Set((values||[]).filter(Boolean))];
const appBaseName=value=>String(value||'').split(' — ')[0].trim();
const appIconKey=value=>appBaseName(value).toLowerCase();
const safeDomain=value=>{
  const domain=String(value||'').trim().toLowerCase().replace(/^www\./,'');
  return /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(domain)?domain:'';
};
const safeAppIcon=value=>/^data:image\/(?:png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(String(value||''))?String(value):'';
function identitySource(item){
  const apps=unique(item?.apps||[]);const domains=unique([item?.domain,...(item?.domains||[])]).map(safeDomain).filter(Boolean);const title=String(item?.title||'').trim().toLowerCase();
  const exactApp=apps.find(app=>appBaseName(app).toLowerCase()===title);const preferredApp=exactApp||apps[0];const appIcon=safeAppIcon(state.appIcons?.[appIconKey(preferredApp)]);
  if(exactApp&&appIcon)return{type:'app',src:appIcon};
  if(domains[0])return{type:'site',src:`https://${domains[0]}/favicon.ico`};
  return appIcon?{type:'app',src:appIcon}:null;
}
function identityIcon(item,fallback){
  const source=identitySource(item);const failed=source?'':' failed';
  return `<span class="identity-mark${failed}" data-identity="${source?.type||'fallback'}">${source?`<img class="identity-image" src="${esc(source.src)}" alt="" aria-hidden="true" onerror="this.closest('.identity-mark').classList.add('failed')">`:''}<span class="identity-fallback">${uiIcon(fallback)}</span></span>`;
}
function activateIdentityIcons(){
  document.querySelectorAll('.identity-image').forEach(image=>{
    const fail=()=>image.closest('.identity-mark')?.classList.add('failed');
    image.addEventListener('error',fail,{once:true});if(image.complete&&!image.naturalWidth)fail();
  });
}

function applyLanguage(){
  language=(state.config?.language||'zh').toLowerCase().startsWith('zh')?'zh':'en';
  document.documentElement.lang=language==='zh'?'zh-CN':'en';
  $('brandTitle').textContent=tx('今日手记','Today Journal');
  $('activeLabel').textContent=tx('活动','Active');$('focusLabel').textContent=tx('专注','Focus');
  $('blockLabel').textContent=tx('片段','Moments');$('switchLabel').textContent=tx('转场','Transitions');
  $('materialLabel').textContent=tx('读过','Reading');$('distributionTitle').textContent=tx('时间花在哪','Where time went');
  $('journeyMapTitle').querySelector('span').textContent=tx('一天的节奏','Day rhythm');
  $('trailTitle').querySelector('span').textContent=tx('今天走过','Your day');
  $('reflectionTitle').querySelector('span').textContent=tx('回看','Looking back');
  $('materialsTitle').querySelector('span').textContent=tx('读过与看过','Reading & watching');
  $('aiDescription').textContent=tx('想再多看一层？只会在你确认后整理。','Want another perspective? Nothing is shared until you confirm.');
  $('prompt').placeholder=tx('关于今天，想问什么？','What are you wondering about today?');
  $('synthesizeBtn').querySelector('span').textContent=tx('一起看看','Take a look');
  $('journeyAsk').textContent=tx('回看这半小时','Look back at this half hour');
  const suggestionCopy={spent:tx('这半小时怎么花的？','How did this half hour go?'),interrupt:tx('哪里被打断？','Where was I interrupted?'),carry:tx('明天接什么？','What should I pick up tomorrow?')};
  document.querySelectorAll('[data-prompt]').forEach(button=>button.textContent=suggestionCopy[button.dataset.prompt]||'');
  $('privacyNote').querySelector('span').textContent=tx('仅存于这台 Mac','Local to this Mac');
  $('privacyTitle').textContent=tx('隐藏不想回看的内容','Hide activity from Today Journal');
  $('privacyDescription').textContent=tx('每行一个 App 或 domain。过滤只影响今日手记，不删除原始日志。','One app or domain per line. Filtering changes this journal, not the raw log.');
  $('appsLabel').textContent=tx('忽略的 App','Ignored apps');$('domainsLabel').textContent=tx('忽略的 Domain','Ignored domains');
  $('cancelPrivacy').textContent=tx('取消','Cancel');$('savePrivacy').textContent=tx('保存并刷新','Save & refresh');
  document.querySelector('[data-range=today]').textContent=tx('今天','Today');document.querySelector('[data-range=week]').textContent=tx('7 天','7 days');document.querySelector('[data-range=custom]').textContent=tx('自定义','Custom');
}

function render(){
  applyLanguage();renderRange();renderNotice();renderOverview();renderDistribution();renderFilters();renderJourneyRibbon();renderTimeline();renderReflection();renderMaterials();activateIdentityIcons();
  document.body.classList.toggle('loading',state.status?.activity==='loading');
}
function renderRange(){
  const mode=state.range?.mode||'today';
  document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('active',b.dataset.range===mode));
  const custom=mode==='custom';$('startDate').classList.toggle('visible',custom);$('endDate').classList.toggle('visible',custom);
  $('startDate').value=state.range?.start||'';$('endDate').value=state.range?.end||'';
  const range=state.range?.start===state.range?.end?state.range?.start:`${state.range?.start||''} → ${state.range?.end||''}`;
  $('dateLabel').textContent=`${tx('只在这台 Mac','Only on this Mac')} · ${range||tx('今天','Today')}`;
}
function renderNotice(){
  const status=state.status||{};const error=status.activityError||status.analysisError;const message=status.activityMessage||status.analysisMessage;
  $('notice').classList.toggle('visible',Boolean(error||message));$('notice').classList.toggle('error',Boolean(error));$('noticeText').textContent=error||message||'';
}
function renderOverview(){
  const m=state.metrics||{},r=state.reflection||{};
  const top=(state.categories||[])[0]?.id;const localHeadline={
    building:tx('今天大多在做东西。','A day mostly spent making.'),learning:tx('今天读了不少，也留下一些想法。','A day of reading and following ideas.'),communication:tx('今天有不少时间在和人连接。','A day shaped by conversations.'),planning:tx('今天在慢慢理清接下来的路。','A day of making room for what comes next.'),admin:tx('今天处理了许多日常小事。','A day of tending to the small things.'),entertainment:tx('今天也给自己留了些松弛。','A day with a little room to unwind.')};
  $('headline').textContent=r.aiEnhanced&&r.headline?r.headline:(localHeadline[top]||tx('今天，慢慢留下了一些痕迹。','The day is beginning to leave a trace.'));
  $('activeMetric').textContent=fmtDuration(m.activeSeconds);$('focusMetric').textContent=fmtDuration(m.focusSeconds);
  $('blockMetric').textContent=String(m.blockCount??0);$('switchMetric').textContent=String(m.contextSwitches??0);$('materialMetric').textContent=String(m.materialCount??0);
}
function renderDistribution(){
  const categories=(state.categories||[]).filter(x=>x.share>0);let cursor=0;const stops=[];
