<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mimo · Today Journal</title>
<style>
:root{
  color-scheme:light;
  --paper:#f5f1e9;--paper-2:#fffdf8;--ink:#302d29;--muted:#7d766d;
  --line:#ddd5c8;--line-soft:#eee7dc;--accent:#8b563e;--accent-soft:#f2e8df;
  --building:#a9583d;--learning:#577d70;--communication:#99743e;
  --planning:#716c9b;--admin:#8a8176;--entertainment:#a36773;
  --seal:#a03c2e;
  --shadow:0 1px 0 rgba(55,47,38,.025);--radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
body{font-size:14px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ui-icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 28px;background:rgba(245,241,233,.94);border-bottom:1px solid rgba(221,214,202,.72);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.brand-mark{width:32px;height:32px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font:600 15px Georgia,serif}
.brand h1{font:600 18px/1 Georgia,"Songti SC",serif;margin:0}
.range-controls{display:flex;align-items:center;gap:9px}
.segmented{display:flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:rgba(255,254,250,.7)}
.segmented button{border:0;background:transparent;padding:6px 11px;border-radius:8px;color:var(--muted);font-size:12px}
.segmented button.active{background:var(--ink);color:#fff;box-shadow:0 3px 12px rgba(48,45,41,.15)}
.date-input{display:none;border:1px solid var(--line);background:var(--paper-2);border-radius:10px;padding:7px 9px;max-width:142px}
.date-input.visible{display:block}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
main{max-width:1440px;margin:0 auto;padding:24px 28px 56px}
.notice{display:none;margin-bottom:16px;padding:11px 14px;border:1px solid var(--line);background:var(--paper-2);border-radius:12px;color:var(--muted)}
.notice.visible{display:flex;align-items:center;justify-content:space-between;gap:12px}
.notice.error{border-color:#d5a3a0;color:#8a3e3b;background:#fff7f4}
.hero{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(340px,.62fr);gap:18px;margin-bottom:18px}
.card{background:var(--paper-2);border:1px solid rgba(221,213,200,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
.overview{padding:26px 28px;overflow:hidden;position:relative}
.overview:after{content:"";position:absolute;right:-78px;top:-108px;width:250px;height:250px;border-radius:50%;border:48px solid rgba(139,86,62,.032);pointer-events:none}
.date-label{color:var(--accent);font-weight:600;letter-spacing:.015em;font-size:11px}
.overview h2{font:600 clamp(28px,3vw,42px)/1.1 Georgia,"Songti SC",serif;max-width:760px;margin:10px 0 0;letter-spacing:-.025em;text-wrap:balance}
.metrics{display:grid;grid-template-columns:1.15fr repeat(3,minmax(0,1fr));gap:12px;margin-top:31px}
.metric{border-top:1px solid var(--line);padding-top:12px;min-width:0;transition:border-color .2s ease}
.metric:hover{border-color:var(--ink)}
.metric-primary{border-top:2px solid var(--accent);padding-top:11px}
.metric strong{display:block;font:600 25px/1 Georgia,"Songti SC",serif;white-space:nowrap;margin-top:8px}
.metric-primary strong{font-size:30px;color:var(--accent)}
.metric-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;letter-spacing:0;white-space:nowrap}
.metric-label .ui-icon{width:14px;height:14px}
.distribution{padding:23px;display:grid;grid-template-columns:134px 1fr;gap:21px;align-items:center}
.donut{width:134px;height:134px;border-radius:50%;position:relative;background:var(--line-soft);box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.donut{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.distribution:hover .donut{transform:scale(1.025);box-shadow:inset 0 0 0 1px rgba(0,0,0,.03),0 10px 24px rgba(74,58,39,.08)}
.donut:after{content:"";position:absolute;inset:23px;background:var(--paper-2);border-radius:50%;box-shadow:0 0 0 1px var(--line-soft)}
.donut-center{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;justify-items:center}
.donut-center .ui-icon{width:15px;height:15px;color:var(--muted);margin-bottom:4px}.donut-center strong{font:600 22px/1 Georgia,serif}.donut-center span{font-size:9px;color:var(--muted);margin-top:4px}
.section-label{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font:600 15px/1.2 Georgia,"Songti SC",serif;letter-spacing:0}
.section-label .ui-icon{width:15px;height:15px;color:var(--accent)}
.legend{display:grid;gap:8px;margin-top:13px}
.legend-row{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.legend-icon{width:21px;height:21px;border-radius:7px;background:color-mix(in srgb,var(--category),white 90%);color:var(--category);display:grid;place-items:center}
.legend-icon .ui-icon{width:12px;height:12px}
.legend-row{grid-template-columns:21px minmax(0,1fr) auto}
.legend-row strong{font-weight:650;color:var(--ink)}
.journey-map{position:relative;z-index:6;margin-bottom:18px;padding:19px 22px 18px;overflow:hidden}
.journey-map-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}
.journey-map-controls{display:flex;align-items:center;gap:10px}.graph-layout-toggle{display:inline-flex;padding:2px;border:1px solid var(--line-soft);border-radius:9px;background:var(--paper)}.graph-layout-toggle button{border:0;border-radius:7px;background:transparent;padding:4px 8px;color:var(--muted);font:650 9px/1.2 inherit}.graph-layout-toggle button.active{background:var(--ink);color:#fff;box-shadow:0 2px 7px rgba(55,43,32,.12)}
.journey-count{font-size:10px;color:var(--muted);letter-spacing:0;font-weight:500;white-space:nowrap}
.journey-thread{min-height:39px;margin:-2px 0 10px;padding:7px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(250,247,240,.78)}
.journey-thread-label{color:var(--accent);font-size:9px;font-weight:750;white-space:nowrap}.journey-thread-route{min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}.journey-thread-route::-webkit-scrollbar{display:none}.journey-route-step{--route:var(--admin);min-width:0;flex:none;display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:0;border-radius:8px;background:color-mix(in srgb,var(--route),white 91%);color:var(--route);font:700 9px/1.3 inherit;white-space:nowrap}.journey-route-step span{max-width:160px;overflow:hidden;text-overflow:ellipsis}.journey-route-step .ui-icon{width:10px;height:10px}.journey-route-step.returning:before{content:"↩";font-weight:800}.journey-route-step:hover,.journey-route-step:focus-visible{outline:1px solid color-mix(in srgb,var(--route),white 45%);background:color-mix(in srgb,var(--route),white 86%)}.journey-route-arrow{flex:none;color:var(--line);font-size:10px}.journey-key{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:8px;white-space:nowrap}.journey-key span{display:inline-flex;align-items:center;gap:4px}.edge-key{display:inline-block;width:17px;height:0;border-top:1.5px solid #a99d90}.edge-key.return{border-top-style:dashed;border-color:var(--accent)}
.journey-graph{position:relative;height:340px;border:1px solid var(--line-soft);border-radius:17px;background:radial-gradient(circle at 48% 38%,rgba(255,255,255,.98),rgba(251,247,239,.82) 72%);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.journey-scene{position:relative;height:100%;min-width:100%}
.journey-scene>svg{position:absolute;inset:0;overflow:visible}
.journey-graph.garden{overflow:hidden}
.seal{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 3px;border-radius:4px;background:var(--seal);color:#fdf8f2;font:700 8px/1 ui-monospace,SFMono-Regular,monospace;transform:rotate(-3deg);box-shadow:0 1px 2px rgba(120,38,26,.25);flex:none}
.stop-label{position:absolute;transform:translateX(-50%);max-width:150px;text-align:center;pointer-events:none;transition:opacity .18s}
.stop-label b{display:block;font:600 12px/1.25 Georgia,"Songti SC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-label>span{display:block;margin-top:1px;color:var(--muted);font-size:9px}
.stop-label .seal{vertical-align:-3px;margin-left:4px}
.stop-hit{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;padding:0;cursor:pointer}
.stop-hit:focus-visible{outline:2px solid var(--accent);outline-offset:-8px}
.scroll-rest{position:absolute;top:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:9.5px;letter-spacing:.12em;writing-mode:vertical-rl;opacity:.8;pointer-events:none}
.scroll-tick{position:absolute;bottom:8px;transform:translateX(-50%);color:var(--muted);font:500 9px ui-monospace,SFMono-Regular,monospace;opacity:.6;pointer-events:none}
.scroll-cap{position:absolute;top:18px;color:var(--accent);font:600 10px/1.6 Georgia,"Songti SC",serif;letter-spacing:.14em;writing-mode:vertical-rl;pointer-events:none}
.scroll-thread{stroke:var(--accent);stroke-width:1.1;fill:none;stroke-dasharray:2 5;opacity:0;transition:opacity .18s}
.stop-dot,.ink-line{transition:opacity .16s}
.journey-graph.dimmed .stop-dot,.journey-graph.dimmed .stop-label{opacity:.15}
.journey-graph.dimmed .stop-dot.lit,.journey-graph.dimmed .stop-label.lit{opacity:1}
.journey-graph.dimmed .ink-line{opacity:.13}
.journey-graph.dimmed .scroll-thread.lit{opacity:.7}
.journey-stone{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;text-align:center;border:0;background:transparent;padding:0;cursor:pointer;transition:opacity .2s,filter .2s}
.stone-core{max-width:100%;padding:4px 10px;pointer-events:none}
.journey-stone b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font:600 var(--stone-font,13px)/1.22 Georgia,"Songti SC",serif;letter-spacing:-.01em;overflow:hidden}
.journey-stone .stone-meta{display:block;margin-top:2px;color:var(--muted);font-size:9.5px}
.journey-stone .stone-visits{display:flex;gap:3px;justify-content:center;margin-top:4px}
.journey-stone .stone-visits i{width:3.5px;height:3.5px;border-radius:50%;background:var(--category,var(--admin));opacity:.65}
.journey-stone .stone-identity{display:block;width:20px;height:20px;margin:0 auto 3px}.journey-stone .stone-identity .ui-icon{width:13px;height:13px;color:var(--category,var(--admin))}
.journey-stone .seal{position:absolute;top:9%;right:9%}
.journey-stone:focus-visible{outline:none}
.journey-stone.selected .stone-core,.journey-stone:focus-visible .stone-core{outline:1.5px solid color-mix(in srgb,var(--category,var(--admin)),white 30%);outline-offset:9px;border-radius:50%}
.journey-graph.dimmed .journey-stone{opacity:.3;filter:saturate(.4)}
.journey-graph.dimmed .journey-stone.lit{opacity:1;filter:none}
.stone-trail{transition:opacity .18s}
.journey-graph.dimmed .stone-trail{opacity:.06}
.journey-graph.dimmed .stone-trail.lit{opacity:.6}
.stone-rest{position:absolute;transform:translate(-50%,-50%);color:var(--muted);font-size:9px;letter-spacing:.1em;white-space:nowrap;background:rgba(250,247,240,.85);padding:2px 7px;border-radius:99px;border:1px dashed var(--line);pointer-events:none}
.topic-detail{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;padding:9px 12px;border:1px solid var(--line-soft);border-radius:12px;background:linear-gradient(110deg,rgba(139,86,62,.045),rgba(87,125,112,.025));font-size:11px}
.topic-detail[hidden]{display:none}
.topic-detail b{font:600 13px/1.3 Georgia,"Songti SC",serif}
.topic-detail .visit-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:0;border-radius:99px;background:color-mix(in srgb,var(--category,var(--accent)),white 90%);color:color-mix(in srgb,var(--category,var(--accent)),black 18%);font:600 10px ui-monospace,SFMono-Regular,monospace;cursor:pointer}
.topic-detail .visit-chip:hover{background:color-mix(in srgb,var(--category,var(--accent)),white 82%)}
.topic-detail .visit-arrow{color:var(--line);font-size:10px}
.topic-detail .topic-edit{margin-left:auto;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);padding:4px 8px;color:var(--accent);font-size:10px;white-space:nowrap}
.topic-detail .topic-edit:hover{border-color:var(--accent);background:var(--accent-soft)}
.half-hour-chapter.pinned{border-color:color-mix(in srgb,var(--category),white 32%);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--category),white 40%),0 8px 18px rgba(63,50,36,.075)}
.topic-cross-day{display:inline-flex;align-items:center;gap:7px}
.history-bars{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.history-bars i{width:4px;height:calc(var(--h,.2)*16px);border-radius:2px;background:color-mix(in srgb,var(--category,var(--accent)),white 30%);opacity:.85}
.history-bars i.zero{height:2px;background:var(--line)}
.weekly-leaf{margin-bottom:18px;padding:24px 26px}
.wk-head{text-align:center;margin-bottom:20px}
.wk-head h3{font:600 20px/1.3 Georgia,"Songti SC",serif;margin:0;letter-spacing:.01em}
.wk-head p{margin:5px 0 0;color:var(--muted);font-size:10.5px;letter-spacing:.08em}
.wk-chapter{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:10px 0;max-width:680px;margin:0 auto}
.wk-chapter time{font:600 11px/2 ui-monospace,SFMono-Regular,monospace;color:var(--accent);text-align:right;white-space:nowrap}
.wk-body{min-width:0;position:relative;padding-left:18px}
.wk-body:before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--category,var(--admin));opacity:.85}
.wk-body:after{content:"";position:absolute;left:3px;top:21px;bottom:-12px;width:1px;background:var(--line-soft)}
.wk-chapter:last-of-type .wk-body:after{display:none}
.wk-body h5{display:inline-block;font:600 16px/1.35 Georgia,"Songti SC",serif;margin:0;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-body h5 svg{display:block;margin-top:1px;width:100%;height:5px;overflow:visible}
.wk-body h5 path{fill:none;stroke:var(--category,var(--admin));stroke-width:1.6;stroke-linecap:round;opacity:.55}
.wk-meta{margin-top:4px;color:var(--muted);font-size:10.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-meta .wk-cat{font-weight:650;color:var(--category,var(--admin))}
.wk-ink{height:4px;border-radius:99px;background:color-mix(in srgb,var(--category,var(--admin)),white 55%);opacity:.75}
.wk-days{display:inline-flex;gap:3px}
.wk-days i{width:9px;height:9px;border-radius:3px;background:var(--line-soft)}
.wk-days i.on{background:color-mix(in srgb,var(--category,var(--admin)),white 35%)}
.wk-frag{max-width:680px;margin:0 auto;padding:12px 0 0 108px;color:var(--muted);font-size:11.5px;line-height:1.7}
.wk-frag b{color:var(--ink);font-weight:600}
.wk-foot{max-width:680px;margin:18px auto 0;padding-top:13px;border-top:1px solid var(--line-soft);text-align:center;color:var(--muted);font-size:10.5px;letter-spacing:.06em}
.journey-tooltip{position:absolute;z-index:8;min-width:190px;max-width:280px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,253,248,.98);box-shadow:0 12px 30px rgba(54,43,31,.12);opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .15s,transform .15s}
.journey-tooltip.visible{opacity:1;transform:none}.journey-tooltip b{display:block;font:600 13px/1.25 Georgia,"Songti SC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.journey-tooltip span{display:block;margin-top:4px;color:var(--muted);font-size:9px}.journey-tooltip strong{color:var(--accent);font-weight:700}
.journey-ribbon{display:flex;align-items:stretch;gap:5px;min-height:49px;position:relative;margin-top:9px;padding:1px 0 4px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}.journey-ribbon::-webkit-scrollbar{display:none}
.half-hour-chapter{--category:var(--admin);position:relative;flex:0 0 154px;min-width:154px;min-height:106px;padding:10px;border:1px solid color-mix(in srgb,var(--category),white 74%);border-radius:16px;background:color-mix(in srgb,var(--category),#fffdf8 95%);color:var(--ink);font:inherit;text-align:left;display:grid;grid-template-rows:auto auto 18px auto;gap:7px;overflow:hidden;scroll-snap-align:start;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s,opacity .2s}
.half-hour-chapter.muted{opacity:.28;filter:saturate(.35)}
.half-hour-chapter.quiet{--category:var(--line);background:linear-gradient(135deg,#fffdf8,#faf6ee);border-style:dashed;color:var(--muted)}
.half-hour-chapter:hover,.half-hour-chapter:focus-visible,.half-hour-chapter.selected{z-index:2;transform:translateY(-2px);border-color:color-mix(in srgb,var(--category),white 38%);box-shadow:0 8px 18px rgba(63,50,36,.075);outline:none}
.half-hour-chapter.selected{box-shadow:0 0 0 1px color-mix(in srgb,var(--category),white 25%),0 8px 18px rgba(63,50,36,.075)}
.chapter-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.chapter-clock{color:var(--accent);font:650 11px ui-monospace,SFMono-Regular,Menlo,monospace}.chapter-used{color:var(--category);font:600 10px Georgia,serif;white-space:nowrap}
.chapter-main{display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:7px;min-width:0}.chapter-identity{width:26px;height:26px;padding:3px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.76);box-shadow:0 0 0 1px rgba(60,50,40,.05)}.chapter-identity .ui-icon{width:13px;height:13px;color:var(--category)}
.chapter-label{display:block;min-width:0;font:600 13px/1.15 Georgia,"Songti SC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapter-track{position:relative;height:18px;border:1px solid rgba(90,73,54,.08);border-radius:6px;background:repeating-linear-gradient(90deg,rgba(90,73,54,.045) 0,rgba(90,73,54,.045) 1px,transparent 1px,transparent 25%);overflow:hidden}.chapter-segment{--segment:var(--admin);position:absolute;top:2px;bottom:2px;min-width:2px;border-radius:4px;background:var(--segment);opacity:.78;transition:opacity .18s,transform .18s}.chapter-segment.filtered{opacity:.1}.half-hour-chapter:hover .chapter-segment,.half-hour-chapter.selected .chapter-segment{opacity:.96;transform:scaleY(1.08)}
.chapter-foot{display:flex;align-items:center;justify-content:space-between;gap:7px;color:var(--muted);font-size:9px;white-space:nowrap}.chapter-foot span:last-child{overflow:hidden;text-overflow:ellipsis}
.journey-ribbon .half-hour-chapter{flex:1 0 82px;min-width:82px;min-height:44px;padding:7px 8px;border-radius:10px;display:grid;grid-template-rows:auto 8px;gap:5px;background:#fffdf9}
.journey-ribbon .chapter-main,.journey-ribbon .chapter-foot{display:none}.journey-ribbon .chapter-top{align-items:baseline}.journey-ribbon .chapter-used{font-size:8px}.journey-ribbon .chapter-track{height:8px;border:0;background:var(--line-soft)}.journey-ribbon .chapter-segment{top:1px;bottom:1px}
.journey-preview{display:grid;grid-template-columns:136px minmax(0,1fr) minmax(210px,auto) auto;align-items:center;gap:14px;min-height:60px;margin-top:7px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:linear-gradient(110deg,rgba(139,86,62,.045),rgba(87,125,112,.025));overflow:hidden}
.journey-preview.updated{animation:preview-in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes preview-in{0%{transform:translateY(3px);background-color:rgba(139,86,62,.08)}100%{transform:none;background-color:transparent}}
.journey-preview-kicker{color:var(--accent);font-size:10px;letter-spacing:0;font-weight:650}
.journey-preview-title{font:600 16px/1.25 Georgia,"Songti SC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

$('journeyGraph').addEventListener('mouseover',event=>{const stop=event.target.closest('[data-stop]');if(stop){setJourneyGraphHover(stop.dataset.topic,stop.dataset.stop);return}const stone=event.target.closest('[data-stone]');if(stone)setJourneyGraphHover(stone.dataset.stone)});

$('journeyGraph').addEventListener('click',event=>{
  const stone=event.target.closest('[data-stone]');
  if(stone){
    selectedTopicID=selectedTopicID===stone.dataset.stone?'':stone.dataset.stone;
    $('journeyGraph').querySelectorAll('.journey-stone').forEach(item=>item.classList.toggle('selected',item.dataset.stone===selectedTopicID));
    renderTopicDetail();
    return;
  }
  const stop=event.target.closest('[data-stop]');if(!stop)return;
  const stay=(journeyModel?.stays||[])[Number(stop.dataset.stop)];if(!stay)return;
  selectedHalfHourID=stay.chapterID;
  updateJourneyPreview(stay.chapterID,`${fmtTime(stay.startMS)} · ${stay.topic.label}`,true);
  const card=[...document.querySelectorAll('.activity-card')].find(item=>item.dataset.block===stay.rep.id);
  if(card){document.querySelectorAll('.activity-card.located').forEach(item=>item.classList.remove('located'));card.classList.add('located');card.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>card.classList.remove('located'),1800)}
});
$('topicDetail').addEventListener('click',event=>{
  const editor=event.target.closest('[data-edit-cluster]');
  if(editor){openTopicEditor(editor.dataset.editCluster);return}
  const chip=event.target.closest('[data-visit-block]');if(!chip)return;
  if(chip.dataset.visitChapter){selectedHalfHourID=chip.dataset.visitChapter;updateJourneyPreview(chip.dataset.visitChapter,'',true)}
  const card=[...document.querySelectorAll('.activity-card')].find(item=>item.dataset.block===chip.dataset.visitBlock);
  if(card){document.querySelectorAll('.activity-card.located').forEach(item=>item.classList.remove('located'));card.classList.add('located');card.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>card.classList.remove('located'),1800)}

$('journeyThread').addEventListener('click',event=>{
  const step=event.target.closest('[data-thread-topic]');if(!step)return;
  const topicID=step.dataset.threadTopic;
  if(activeGraphLayout()==='topic'){
    selectedTopicID=topicID;
    $('journeyGraph').querySelectorAll('.journey-stone').forEach(item=>item.classList.toggle('selected',item.dataset.stone===selectedTopicID));
    renderTopicDetail();
    $('journeyGraph').querySelector(`[data-stone="${CSS.escape(topicID)}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest'});
  }else{
    setJourneyGraphHover(topicID);
    const first=(journeyModel?.stays||[]).findIndex(stay=>stay.topicID===topicID);
    if(first>=0)$('journeyGraph').querySelector(`[data-stop="${first}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }

function seedLookingBack(promptKey='spent'){
  const chapter=selectedHalfHour();if(!chapter||!chapter.activeSeconds)return;focusedLookingBackID=chapter.id;const copy={spent:tx('这半小时，我把时间花在哪里了？','How did I spend this half hour?'),interrupt:tx('这半小时，哪里被打断或切换得最频繁？','Where was I interrupted or switching most in this half hour?'),carry:tx('从这半小时里，明天最值得接着做什么？','What from this half hour is most worth picking up tomorrow?')};$('prompt').value=copy[promptKey]||copy.spent;$('prompt').focus();
